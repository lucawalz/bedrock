name: build-cluster-node-snapshot

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - modules/k3s/cluster-node.nix
      - modules/k3s/estate.nix
      - modules/k3s/hetzner-scaffolding.nix
      - infra/packer/**
      - scripts/nixos-image-hash.sh
      - .github/workflows/build-cluster-node-snapshot.yml
  pull_request:
    paths:
      - infra/packer/**
      - scripts/nixos-image-hash.sh
      - .github/workflows/build-cluster-node-snapshot.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: node-snapshot-build
  cancel-in-progress: false

permissions: {}

env:
  SNAPSHOT_RETENTION: "3"
  SNAPSHOT_IMAGE_NAME: bedrock-cluster-node
  # horizon reads this label to pick the boot image; the key is legacy and its default lives in horizon's config
  SELECTOR_LABEL: caph-image-name

jobs:
  packer-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "~1.11"

      - name: Generate ephemeral SSH key
        run: ssh-keygen -t ed25519 -f /tmp/packer_key -N ""

      - name: Validate the packer templates
        working-directory: infra/packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKR_VAR_hcloud_token: validate-only
          PKR_VAR_nixos_commit_sha: ${{ github.sha }}
          PKR_VAR_nixos_hash: validate-only
          PKR_VAR_ssh_private_key_file: /tmp/packer_key
        run: |
          packer init .
          packer fmt -check .
          packer validate .

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "~1.11"

      - name: Compute nixos config tree hash
        id: hash
        run: echo "nixos_hash=$(bash scripts/nixos-image-hash.sh)" >> "$GITHUB_OUTPUT"

      - name: Check for existing snapshot
        id: check
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NIXOS_HASH: ${{ steps.hash.outputs.nixos_hash }}
        run: |
          count=$(curl -sf -G \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            --data-urlencode "type=snapshot" \
            --data-urlencode "label_selector=bedrock-role=cluster-node,bedrock-nixos-hash=${NIXOS_HASH}" \
            "https://api.hetzner.cloud/v1/images" \
            | jq '.images | length')
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate ephemeral SSH key
        if: steps.check.outputs.exists != 'true'
        run: ssh-keygen -t ed25519 -f /tmp/packer_key -N ""

      - name: Packer init
        if: steps.check.outputs.exists != 'true'
        working-directory: infra/packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .

      - name: Build snapshot
        if: steps.check.outputs.exists != 'true'
        working-directory: infra/packer
        env:
          PKR_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          PKR_VAR_nixos_commit_sha: ${{ github.sha }}
          PKR_VAR_nixos_hash: ${{ steps.hash.outputs.nixos_hash }}
          PKR_VAR_ssh_private_key_file: /tmp/packer_key
        run: packer build -only=hcloud.cluster-node .

  cleanup:
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup leaked packer ssh keys
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/ssh_keys?per_page=50" \
            | jq -r '.ssh_keys[] | select(.name | startswith("packer-")) | .id' \
            | while read -r id; do
                curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
                  "https://api.hetzner.cloud/v1/ssh_keys/$id"
              done

      - name: Cleanup leaked packer servers
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/servers?per_page=50" \
            | jq -r '.servers[] | select(.name | startswith("packer-")) | .id' \
            | while read -r id; do
                curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
                  "https://api.hetzner.cloud/v1/servers/$id"
              done

      - name: Verify current snapshot exists
        id: verify
        if: needs.build.result == 'success'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          current_hash="$(bash scripts/nixos-image-hash.sh)"
          count=$(curl -sf -G \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            --data-urlencode "type=snapshot" \
            --data-urlencode "label_selector=bedrock-role=cluster-node,bedrock-nixos-hash=${current_hash}" \
            "https://api.hetzner.cloud/v1/images" \
            | jq '.images | length')
          if [ "$count" -lt 1 ]; then
            echo "no snapshot found for current hash ${current_hash}; refusing to prune" >&2
            exit 1
          fi
          echo "current_hash=${current_hash}" >> "$GITHUB_OUTPUT"

      - name: Promote the current snapshot for on-demand provisioning
        if: steps.verify.outcome == 'success'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CURRENT_HASH: ${{ steps.verify.outputs.current_hash }}
        run: |
          images=$(curl -sf -G \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            --data-urlencode "type=snapshot" \
            --data-urlencode "label_selector=bedrock-role=cluster-node,bedrock-managed=true" \
            --data-urlencode "sort=created:desc" \
            "https://api.hetzner.cloud/v1/images?per_page=50")
          relabel() {
            curl -sf -X PUT -H "Authorization: Bearer $HCLOUD_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"labels\": $2}" \
              "https://api.hetzner.cloud/v1/images/$1" >/dev/null
          }
          selected=$(echo "$images" | jq -r --arg hash "$CURRENT_HASH" \
            'first(.images[] | select(.labels["bedrock-nixos-hash"] == $hash) | .id) // empty')
          if [ -z "$selected" ]; then
            echo "no current-hash snapshot to promote" >&2
            exit 1
          fi
          labels=$(echo "$images" | jq -c \
            --argjson id "$selected" \
            --arg label "$SELECTOR_LABEL" \
            --arg name "$SNAPSHOT_IMAGE_NAME" \
            '(.images[] | select(.id == $id) | .labels) + {($label): $name}')
          relabel "$selected" "$labels"
          echo "$images" | jq -r --argjson sel "$selected" --arg label "$SELECTOR_LABEL" \
            '.images[] | select(.id != $sel and (.labels | has($label))) | .id' \
            | while read -r id; do
                stale_labels=$(echo "$images" | jq -c --argjson id "$id" --arg label "$SELECTOR_LABEL" \
                  '(.images[] | select(.id == $id) | .labels) | del(.[$label])')
                relabel "$id" "$stale_labels"
              done

      - name: Prune duplicate and stale snapshots
        if: steps.verify.outcome == 'success'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CURRENT_HASH: ${{ steps.verify.outputs.current_hash }}
        run: |
          curl -sf -G \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            --data-urlencode "type=snapshot" \
            --data-urlencode "label_selector=bedrock-role=cluster-node,bedrock-managed=true" \
            --data-urlencode "sort=created:desc" \
            "https://api.hetzner.cloud/v1/images?per_page=50" \
            | jq -r --arg hash "$CURRENT_HASH" --argjson keep "$SNAPSHOT_RETENTION" '
              ([.images[] | select(.labels["bedrock-nixos-hash"] == $hash)] | .[1:] | .[].id),
              ([.images[] | select(.labels["bedrock-nixos-hash"] != $hash)] | .[($keep - 1):] | .[].id)
            ' \
            | while read -r id; do
                curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
                  "https://api.hetzner.cloud/v1/images/$id"
              done
