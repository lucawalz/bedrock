name: image-scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  issues: write

env:
  ISSUE_TITLE: Running images with fixed critical vulnerabilities

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/manifest-tools

      - name: Install trivy
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: v0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/trivy.tar.gz" -C /usr/local/bin trivy

      - name: List the images the cluster runs
        run: bash scripts/list-images.sh 2> /dev/null | sort -u > "$RUNNER_TEMP/images"

      - name: Scan every image for fixed critical vulnerabilities
        run: |
          : > "$RUNNER_TEMP/findings"
          : > "$RUNNER_TEMP/failed"
          while read -r image; do
            echo "Scanning $image"
            if ! trivy image --quiet --severity CRITICAL --ignore-unfixed --format json --output "$RUNNER_TEMP/result.json" "$image"; then
              echo "$image" >> "$RUNNER_TEMP/failed"
              continue
            fi
            IMAGE="$image" jq -r '
              .Results[]?.Vulnerabilities[]?
              | "| `" + env.IMAGE + "` | " + .PkgName + " | " + .VulnerabilityID + " | " + .InstalledVersion + " | " + .FixedVersion + " |"
            ' "$RUNNER_TEMP/result.json" >> "$RUNNER_TEMP/findings"
          done < "$RUNNER_TEMP/images"
          [ ! -s "$RUNNER_TEMP/failed" ] || { echo "Images that could not be scanned:"; cat "$RUNNER_TEMP/failed"; }

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [ -s "$RUNNER_TEMP/findings" ]; then
            {
              echo "Trivy found critical vulnerabilities with a fixed version in images the cluster runs. Updated by the image-scan workflow on $(date -u +%F)."
              echo
              echo "| Image | Package | Vulnerability | Installed | Fixed |"
              echo "| --- | --- | --- | --- | --- |"
              sort -u "$RUNNER_TEMP/findings"
            } > "$RUNNER_TEMP/body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No fixed critical vulnerabilities in the scanned images."
          fi
          [ ! -s "$RUNNER_TEMP/failed" ]
