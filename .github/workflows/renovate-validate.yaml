name: renovate-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Validate renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.68.3
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator

      - name: Check custom managers still match something
        run: ./scripts/check-renovate-managers.sh
