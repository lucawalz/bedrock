name: nix-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Check formatting
        run: git ls-files '*.nix' | xargs nix fmt -- --check

      - name: Run statix
        run: nix run nixpkgs#statix -- check .

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- --fail .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Evaluate all NixOS configurations
        run: nix flake check --no-build

  secrets-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Test the secrets re-key, token writes and their refusals
        run: bash scripts/check-rekey-secrets.sh

      - name: Test the cluster CA re-issue and its refusals
        run: bash scripts/check-generate-cluster-ca.sh

      - name: Test the Longhorn volume restore and its refusals
        run: bash scripts/check-restore-volume.sh

      - name: Test the Longhorn volume re-key copy and its refusals
        run: bash scripts/check-encrypt-volumes.sh

      - name: Test the on-demand Longhorn backups and their refusals
        run: bash scripts/check-backup-volumes.sh

      - name: Test the Tailscale auth key writes and their refusals
        run: bash scripts/check-tailscale-authkeys.sh

      - name: Test the pinned known_hosts file and its refusals
        run: bash scripts/check-known-hosts.sh

  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      hosts: ${{ steps.nodes.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: List cluster nodes from the inventory
        id: nodes
        run: |
          hosts=$(nix eval --json --file lib/inventory.nix --apply 'inv: builtins.attrNames inv.nodes')
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  build-x86:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.inventory.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build ${{ matrix.host }} toplevel
        env:
          HOST: ${{ matrix.host }}
        run: nix build --no-link --print-out-paths ".#nixosConfigurations.${HOST}.config.system.build.toplevel"
