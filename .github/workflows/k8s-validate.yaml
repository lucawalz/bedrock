name: k8s-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes/ -name "*.yaml" \
            ! -path "*/flux-system/gotk-components.yaml" \
            ! -name "*.sops.yaml" \
            ! -name "values.yaml" \
            | xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location "$KUBECONFORM_SCHEMA_LOCATION" \
              -kubernetes-version 1.35.0 \
              -summary
        # Skips: gotk-components (generated, large), sops secrets (encrypted, not valid YAML values)

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/(?<version>.+)$
          KUSTOMIZE_VERSION: v5.8.1
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize

      - name: Build all kustomizations
        run: |
          # Build each kustomization to ensure all resources resolve correctly
          # Skips encrypted secret files that kustomize can't process without SOPS key
          find kubernetes/ -name "kustomization.yaml" -not -path "*/secrets/*" | while read f; do
            dir=$(dirname "$f")
            echo "Building $dir..."
            kustomize build "$dir" > /dev/null || exit 1
          done

  kyverno-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kyverno CLI
        env:
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_VERSION: v1.18.1
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin kyverno

      - name: Run policy unit tests
        run: kyverno test tests/policies/

      - name: Apply policies to first-party manifests
        run: |
          kyverno apply kubernetes/infrastructure/configs/policies/ \
            --resource kubernetes/apps/blog/app/deployment.yaml

  promtool-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install promtool and yq
        env:
          # renovate: datasource=github-releases depName=prometheus/prometheus
          PROMETHEUS_VERSION: v3.13.1
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.53.3
        run: |
          prometheus_dir="prometheus-${PROMETHEUS_VERSION#v}.linux-amd64"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/${prometheus_dir}.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "${prometheus_dir}/promtool"
          curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Check and test alert rules
        run: |
          rules_dir=kubernetes/infrastructure/controllers/observability/alert-rules
          for name in slo-blog gap-filler; do
            case "$name" in
              slo-blog) src="$rules_dir/slo-blog.yaml" ;;
              gap-filler) src="$rules_dir/prometheusrule.yaml" ;;
            esac
            yq '.spec' "$src" > "tests/promtool/$name-rules.gen.yaml"
            promtool check rules "tests/promtool/$name-rules.gen.yaml"
            promtool test rules "tests/promtool/${name}_test.yaml"
          done

  sops-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SOPS files are actually encrypted
        # Prevents accidentally committing decrypted secrets
        run: |
          fail=0
          for f in $(find kubernetes/ -name "*.sops.yaml"); do
            if ! grep -q "ENC\[AES256_GCM" "$f"; then
              echo "ERROR: $f does not appear to be encrypted"
              fail=1
            fi
          done
          exit $fail

  flux-substitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flux
        env:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          FLUX_VERSION: v2.9.3
        run: |
          curl -sSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin flux

      - uses: ./.github/actions/kubeconform

      - name: Render the Flux Kustomizations and validate the applied output
        run: bash scripts/validate-substitution.sh
