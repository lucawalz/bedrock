name: k8s-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/manifest-tools

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes/ -name "*.yaml" \
            ! -path "*/flux-system/gotk-components.yaml" \
            ! -name "*.sops.yaml" \
            ! -name "values.yaml" \
            -print0 \
            | xargs -0 kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location "$KUBECONFORM_SCHEMA_LOCATION" \
              -kubernetes-version 1.35.0 \
              -summary
        # Skips: gotk-components (generated, large), sops secrets (encrypted, not valid YAML values)

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/manifest-tools

      - name: Build all kustomizations
        run: |
          # Skips encrypted secret files that kustomize can't process without SOPS key
          find kubernetes/ -name "kustomization.yaml" -not -path "*/secrets/*" \
            | while read -r file; do
                directory="$(dirname "$file")"
                echo "Building $directory"
                kustomize build "$directory" > /dev/null || exit 1
              done

      - name: Check every app directory is deployed
        run: bash scripts/check-apps-index.sh

  helm-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/manifest-tools

      - name: Render every HelmRelease and validate the output
        run: bash scripts/render-helm-releases.sh

  kyverno-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/manifest-tools

      - name: Install kyverno CLI
        env:
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_VERSION: v1.18.2
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin kyverno

      - name: Run policy unit tests
        run: kyverno test tests/policies/

      - name: Apply policies to the rendered workloads
        run: bash scripts/apply-policies.sh

  promtool-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/manifest-tools

      - name: Install promtool
        env:
          # renovate: datasource=github-releases depName=prometheus/prometheus
          PROMETHEUS_VERSION: v3.13.1
        run: |
          prometheus_dir="prometheus-${PROMETHEUS_VERSION#v}.linux-amd64"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/${prometheus_dir}.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "${prometheus_dir}/promtool"

      - name: Check and test alert rules
        run: bash scripts/check-alert-rules.sh

  sops-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SOPS files are actually encrypted
        # Prevents accidentally committing decrypted secrets
        run: |
          fail=0
          while read -r file; do
            if ! grep -q "ENC\[AES256_GCM" "$file"; then
              echo "ERROR: $file does not appear to be encrypted"
              fail=1
            fi
          done < <(find kubernetes/ -name "*.sops.yaml")
          exit $fail

  flux-substitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flux
        env:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          FLUX_VERSION: v2.9.3
        run: |
          curl -sSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin flux

      - uses: ./.github/actions/manifest-tools

      - name: Render the Flux Kustomizations and validate the applied output
        run: bash scripts/validate-substitution.sh
