    patchedResources: resources/patched-unset-escalation.yaml
    result: pass
  - policy: default-privilege-escalation
    rule: init-containers-privilege-escalation
    kind: Pod
    resources:
      - unset-escalation
    patchedResources: resources/patched-unset-escalation.yaml
    result: pass
  - policy: default-privilege-escalation
    rule: ephemeral-containers-privilege-escalation
    kind: Pod
    resources:
      - unset-escalation
    patchedResources: resources/patched-unset-escalation.yaml
