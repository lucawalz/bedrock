apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-and-limits
policies:
  - ../../kubernetes/infrastructure/configs/policies/require-resources.yaml
  - ../../kubernetes/infrastructure/configs/policies/require-run-as-non-root.yaml
  - ../../kubernetes/infrastructure/configs/policies/disallow-privilege-escalation.yaml
  - ../../kubernetes/infrastructure/configs/policies/require-drop-all-capabilities.yaml
  - ../../kubernetes/infrastructure/configs/policies/disallow-latest-tag.yaml
  - ../../kubernetes/infrastructure/configs/policies/mutate-privilege-escalation.yaml
  - ../../kubernetes/infrastructure/configs/policies/generate-network-policies.yaml
exceptions:
  - ../../kubernetes/infrastructure/configs/policies/exceptions.yaml
resources:
  - resources/compliant.yaml
  - resources/violating.yaml
  - resources/unset-escalation.yaml
  - resources/escalating.yaml
  - resources/exempt.yaml
  - resources/init-violating.yaml
  - resources/ephemeral-violating.yaml
  - resources/exempt-reloader.yaml
  - resources/exempt-encrypt-copy.yaml
  - resources/paperless-foreign-image.yaml
