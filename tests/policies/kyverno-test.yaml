    kind: Pod
    resources:
      - compliant
    result: pass
  - policy: disallow-privilege-escalation
    rule: privilege-escalation
    kind: Pod
    resources:
      - violating
    result: pass
  - policy: disallow-privilege-escalation
    rule: privilege-escalation
    kind: Pod
    resources:
      - escalating
    result: fail
  - policy: require-drop-all-capabilities
