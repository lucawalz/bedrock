apiVersion: v1
kind: Pod
metadata:
  name: seccomp-set
  namespace: default
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/app.json
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        allowPrivilegeEscalation: false
