apiVersion: v1
kind: Pod
metadata:
  name: unset-escalation
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.0.0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        capabilities:
          drop:
            - ALL
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        capabilities:
          drop:
            - ALL
