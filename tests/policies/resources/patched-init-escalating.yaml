apiVersion: v1
kind: Pod
metadata:
  name: init-escalating
  namespace: default
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.0.0
      securityContext:
        allowPrivilegeEscalation: true
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        allowPrivilegeEscalation: false
