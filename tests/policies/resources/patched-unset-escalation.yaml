apiVersion: v1
kind: Pod
metadata:
  name: unset-escalation
  namespace: default
spec:
  containers:
    - image: ghcr.io/example/app:1.2.3
      name: app
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 25m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  initContainers:
    - image: ghcr.io/example/init:1.0.0
      name: init
      resources:
        limits:
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  securityContext:
    runAsNonRoot: true
