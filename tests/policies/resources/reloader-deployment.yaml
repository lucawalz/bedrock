apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-reloader
  namespace: reloader
  labels:
    app.kubernetes.io/name: reloader
    app.kubernetes.io/instance: reloader
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reloader
      app.kubernetes.io/instance: reloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reloader
        app.kubernetes.io/instance: reloader
    spec:
      containers:
        - name: reloader
          image: ghcr.io/stakater/reloader:1.0.0
