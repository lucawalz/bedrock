apiVersion: v1
kind: Pod
metadata:
  name: init-violating
  namespace: default
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  initContainers:
    - name: init
      image: busybox:latest
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
