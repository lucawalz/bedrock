rule_files:
  - gap-filler-rules.gen.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: velero backup past the warning threshold fires warning only
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '-101000x200'
    alert_rule_test:
      - eval_time: 180m
        alertname: VeleroBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr has no recent successful backup"
              description: "The newest successful Velero backup for schedule daily-dr is 1d 7h 3m 20s old, exceeding the 30 hour warning threshold for the daily backup schedule."
      - eval_time: 180m
        alertname: VeleroBackupTooOldCritical
        exp_alerts: []

  - interval: 1m
    name: velero backup past the critical threshold fires critical
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '-190000x200'
    alert_rule_test:
      - eval_time: 180m
        alertname: VeleroBackupTooOldCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr has a dangerously stale backup"
              description: "The newest successful Velero backup for schedule daily-dr is 2d 7h 46m 40s old, exceeding the 50 hour critical threshold and indicating several missed daily backups."

  - interval: 1m
    name: velero backup failures raise an alert
    input_series:
      - series: 'velero_backup_failure_total{schedule="daily-dr"}'
        values: '0x60 1x60'
      - series: 'velero_backup_validation_failure_total{schedule="daily-dr"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: VeleroBackupFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr is failing"
              description: "Velero schedule daily-dr recorded backup or validation failures in the last two hours, so the offsite copy is not being written."

  - interval: 1m
    name: healthy velero backups raise nothing
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '0x200'
      - series: 'velero_backup_failure_total{schedule="daily-dr"}'
        values: '0x120'
      - series: 'velero_backup_validation_failure_total{schedule="daily-dr"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: VeleroBackupFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: VeleroBackupTooOld
        exp_alerts: []

  - interval: 1m
    name: longhorn stale backup fires warning but not critical
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc"}'
        values: '1x1900'
      - series: 'longhorn_volume_last_backup_at{volume="pvc-never"}'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 1870m
        alertname: LonghornBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc has no recent backup"
              description: "The newest Longhorn backup for volume pvc-abc is 1d 7h 9m 59s old, exceeding the 30 hour warning threshold for the nightly recurring job."
      - eval_time: 1870m
        alertname: LonghornBackupTooOldCritical
        exp_alerts: []

  - interval: 1m
    name: a single switchover archive failure does not alert
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="postgres", pod="postgres-2"}'
        values: '0+0x30 1+0x90'
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="postgres", pod="postgres-2", value="ready"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: CNPGWALArchiveFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: CNPGWALArchiveBacklog
        exp_alerts: []

  - interval: 1m
    name: a sustained archive outage alerts on rate and backlog
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="postgres", pod="postgres-2"}'
        values: '0+2x180'
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="postgres", pod="postgres-2", value="ready"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: CNPGWALArchiveFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
            exp_annotations:
              summary: "CloudNativePG WAL archiving is failing in postgres"
              description: "CloudNativePG in namespace postgres recorded 30 failed WAL archive attempts in the last 15 minutes. The archiver retries one stuck segment on a fixed loop, so a sustained rate means continuous archiving has stopped and point-in-time recovery is frozen at the last archived segment. The counters live only on whichever instance is primary and reset when the role moves, so this sums across the namespace rather than tracking a pod."
      - eval_time: 120m
        alertname: CNPGWALArchiveBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
            exp_annotations:
              summary: "CloudNativePG has unarchived WAL segments in postgres"
              description: "CloudNativePG in namespace postgres has 120 WAL segments waiting to be archived and has not cleared them for 30 minutes. WAL shares the data volume, so a backlog that keeps growing eventually fills it and stops the primary. This measures the backlog directly and carries no counter-reset semantics, so it stays valid across a switchover."

  - interval: 1m
    name: a never backed up volume alerts once past the grace period
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-never", pvc="kiwix-library", pvc_namespace="kiwix"}'
        values: '0x1700'
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc", pvc="n8n-data", pvc_namespace="n8n"}'
        values: '1x1700'
    alert_rule_test:
      - eval_time: 1000m
        alertname: LonghornVolumeNeverBackedUp
        exp_alerts: []
      - eval_time: 1610m
        alertname: LonghornVolumeNeverBackedUp
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-never
              pvc: kiwix-library
              pvc_namespace: kiwix
            exp_annotations:
              summary: "Longhorn volume kiwix/kiwix-library has never been backed up"
              description: "Longhorn has recorded no backup at all for volume pvc-never, claimed by kiwix/kiwix-library, for over 26 hours. The stale-backup alerts cannot see this case because they compare against the newest backup timestamp, which does not exist here. A volume in this state has no restore point whatsoever."

  - interval: 1m
    name: a longhorn backup in error state alerts
    input_series:
      - series: 'longhorn_backup_state{backup="backup-31a1b5625e944c3a", volume="pvc-f4becfb7"}'
        values: '4x120'
      - series: 'longhorn_backup_state{backup="backup-completed", volume="pvc-abc"}'
        values: '3x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              backup: backup-31a1b5625e944c3a
              volume: pvc-f4becfb7
            exp_annotations:
              summary: "Longhorn backup backup-31a1b5625e944c3a is in Error state"
              description: "Longhorn reports backup backup-31a1b5625e944c3a of volume pvc-f4becfb7 in Error state. A failed backup leaves the volume on its previous restore point, or on none at all if this was its first, and the recurring job does not retry until the next scheduled run."

  - interval: 1m
    name: longhorn degraded volume alerts
    input_series:
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '2x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc is degraded"
              description: "Longhorn reports volume pvc-abc as degraded for over 30 minutes, so it is running with fewer healthy replicas than configured."

  - interval: 1m
    name: healthy longhorn raises nothing
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc"}'
        values: '0x200'
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: LonghornBackupTooOld
        exp_alerts: []
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts: []

  - interval: 1m
    name: a cnpg backup wedged in a non-terminal phase alerts
    input_series:
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260724030000", phase="walArchivingFailing"}'
        values: '1x480'
    alert_rule_test:
      - eval_time: 300m
        alertname: CNPGBackupStuck
        exp_alerts: []
      - eval_time: 420m
        alertname: CNPGBackupStuck
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
              name: postgres-daily-20260724030000
              phase: walArchivingFailing
            exp_annotations:
              summary: "CloudNativePG backup postgres/postgres-daily-20260724030000 is stuck in phase walArchivingFailing"
              description: "The CloudNativePG backup postgres/postgres-daily-20260724030000 has been in the non-terminal phase walArchivingFailing for more than 6 hours. CloudNativePG never times such a backup out and a ScheduledBackup refuses to create a new one while a non-terminal backup exists, so every later run is suppressed until this object reaches a terminal phase or is deleted."

  - interval: 1m
    name: completed cnpg backups raise nothing
    input_series:
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260724030000", phase="completed"}'
        values: '1x480'
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260723030000", phase="failed"}'
        values: '1x480'
    alert_rule_test:
      - eval_time: 420m
        alertname: CNPGBackupStuck
        exp_alerts: []

  - interval: 1m
    name: etcd snapshots that never reach s3 raise the upload alert only
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: an s3 snapshot that failed to upload does not count as offsite
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-etcd-snapshot-master-1", node="master", location="s3://basalt-backups/etcd-snapshots/etcd-snapshot-master-1", ready="false"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a stopped snapshot schedule raises both etcd alerts
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: current local and s3 etcd snapshots raise nothing
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-etcd-snapshot-master-1", node="master", location="s3://basalt-backups/etcd-snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts: []

  - interval: 1m
    name: slow etcd wal fsync alerts but healthy fsync does not
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.016"}'
        values: '0+60x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.128"}'
        values: '0+60x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="+Inf"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: EtcdWalFsyncSlow
        exp_alerts: []

  - interval: 1m
    name: etcd wal fsync above the threshold alerts
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.016"}'
        values: '0+0x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.128"}'
        values: '0+59x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="+Inf"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: EtcdWalFsyncSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "etcd WAL fsync p99 is above 100ms"
              description: "The p99 etcd WAL fsync duration has exceeded 100 milliseconds for 15 minutes, against a 10 millisecond target for healthy etcd. etcd shares one NVMe with the Longhorn replica data on master, so sustained slow fsync usually means storage contention rather than an etcd fault. The upstream etcdHighFsyncDurations alert only fires at 500 milliseconds, which is far above the range this estate operates in and would miss this entirely."

  - interval: 1m
    name: on-demand snapshots do not mask a stopped schedule
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '0x1900'
      - series: 'kube_etcdsnapshotfile_created{name="local-on-demand-master-2", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/on-demand-master-2", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-s3-verify-master-2", node="master", location="s3://basalt-backups/etcd-snapshots/s3-verify-master-2", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a dead exporter raises the absent guards
    input_series:
      - series: 'up{job="kube-prometheus-stack-kube-state-metrics"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "kube-state-metrics has stopped reporting"
              description: "Prometheus has held no kube_pod_info series for more than 15 minutes, so every workload, node and capacity alert derived from kube-state-metrics is unable to fire."
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Flux resource metrics have disappeared"
              description: "Prometheus has held no flux_resource_info series for more than 15 minutes, so FluxReconciliationFailure cannot fire and a stalled delivery pipeline would stay invisible."

  - interval: 1m
    name: reporting exporters raise nothing
    input_series:
      - series: 'kube_pod_info{namespace="monitoring", pod="prometheus-0"}'
        values: '1x60'
      - series: 'flux_resource_info{kind="Kustomization", name="apps", exported_namespace="flux-system", ready="True", suspended="False"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxReconciliationFailure
        exp_alerts: []

  - interval: 1m
    name: longhorn scheduling headroom past the warning threshold fires warning only
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-1"}'
        values: '95x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-1"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              node: worker-1
            exp_annotations:
              summary: "Longhorn node worker-1 has little replica scheduling headroom left"
              description: "Longhorn has already promised 95 percent of the replica capacity on node worker-1. This counts space committed to volumes rather than bytes written, so the disk is not filling up. What it bounds is provisioning: with hard replica anti-affinity and allowVolumeCreationWithDegradedAvailability disabled, once any node reaches 100 percent no new three-replica volume can be created anywhere in the cluster."
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomCritical
        exp_alerts: []

  - interval: 1m
    name: longhorn scheduling headroom past the critical threshold fires critical
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-1"}'
        values: '98x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-1"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              node: worker-1
            exp_annotations:
              summary: "Longhorn node worker-1 is almost out of replica scheduling headroom"
              description: "Longhorn has promised 98 percent of the replica capacity on node worker-1. New three-replica volume creation is about to fail cluster-wide. Free space by deleting unused volumes or their orphaned replicas, or expand the disk."

  - interval: 1m
    name: healthy longhorn headroom fires nothing
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-2"}'
        values: '51x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-2"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomLow
        exp_alerts: []

  - interval: 1m
    name: node temperature past the warning threshold fires warning only
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="master",chip="platform_coretemp_0",sensor="temp1"}'
        values: '78x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: master
            exp_annotations:
              summary: "Node master is running hot"
              description: "The hottest sensor on master has read 78 degrees Celsius for over 15 minutes, well above the 45 to 60 degree band these nodes sit in at rest. The usual causes are a blocked intake, a failing fan or a sustained workload."
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts: []

  - interval: 1m
    name: node temperature past the critical threshold fires critical
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="worker-2",chip="platform_coretemp_0",sensor="temp1"}'
        values: '90x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: worker-2
            exp_annotations:
              summary: "Node worker-2 is close to thermal throttling"
              description: "The hottest sensor on worker-2 has read 90 degrees Celsius for over 5 minutes. Sustained temperatures at this level throttle the CPU and shorten hardware life."

  - interval: 1m
    name: the router is excluded from temperature alerting
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="pi-router",chip="platform_soc",sensor="temp1"}'
        values: '90x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts: []

  - interval: 1m
    name: container memory past the warning threshold fires warning only
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik",pod="authentik-server-0",container="server"}'
        values: '90x200'
      - series: 'kube_pod_container_resource_limits{namespace="authentik",pod="authentik-server-0",container="server",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              pod: authentik-server-0
              container: server
            exp_annotations:
              summary: "Container server in authentik/authentik-server-0 is close to its memory limit"
              description: "Container server has held above 85 percent of its memory limit for 30 minutes, currently 90%. Exceeding the limit is an immediate OOMKill rather than a gradual slowdown, so this is the only warning available before the container is terminated. Either the limit was set below what the workload needs or the workload is leaking."
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts: []

  - interval: 1m
    name: container memory past the critical threshold fires critical
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="llm",pod="open-webui-0",container="open-webui"}'
        values: '98x200'
      - series: 'kube_pod_container_resource_limits{namespace="llm",pod="open-webui-0",container="open-webui",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: llm
              pod: open-webui-0
              container: open-webui
            exp_annotations:
              summary: "Container open-webui in llm/open-webui-0 is about to be OOMKilled"
              description: "Container open-webui has held above 95 percent of its memory limit for 10 minutes, currently 98%. Raise the limit or restart the workload before the kernel does it."

  - interval: 1m
    name: a container comfortably inside its memory limit fires nothing
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="monitoring",pod="loki-0",container="loki"}'
        values: '40x200'
      - series: 'kube_pod_container_resource_limits{namespace="monitoring",pod="loki-0",container="loki",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts: []

  - interval: 1m
    name: a container with no declared limit is not evaluated
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="longhorn-system",pod="longhorn-ui-0",container="longhorn-ui"}'
        values: '900x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  - interval: 1m
    name: a restart whose previous instance was OOMKilled fires critical
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="metallb-system",pod="metallb-controller-0",container="controller"}'
        values: '0+1x200'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="metallb-system",pod="metallb-controller-0",container="controller",reason="OOMKilled"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: metallb-system
              pod: metallb-controller-0
              container: controller
            exp_annotations:
              summary: "Container controller in metallb-system/metallb-controller-0 was OOMKilled"
              description: "Container controller restarted in the last hour and its previous instance was terminated for exceeding its memory limit. The limit is wrong or the workload is leaking; the container will keep being killed until one of the two is corrected."

  - interval: 1m
    name: a restart for a reason other than OOM does not fire
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="blog",pod="blog-0",container="blog"}'
        values: '0+1x200'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="blog",pod="blog-0",container="blog",reason="Error"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerOOMKilled
        exp_alerts: []

  - interval: 1m
    name: a standby that stops streaming fires while the primary and the healthy standby stay quiet
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-3"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-3"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGStandbyNotStreaming
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: postgres
              pod: postgres-3
            exp_annotations:
              summary: "CloudNativePG standby postgres/postgres-3 has stopped streaming"
              description: "The standby postgres/postgres-3 has no WAL receiver, so it is no longer replicating from the primary. Nothing else reports this: the pod stays Running and Ready because the instance manager is healthy, readyInstances still counts it, and quorum synchronous replication is satisfied by the remaining standby, so writes never degrade. A standby in this state silently stops being a copy of the data. The match on cnpg_pg_replication_in_recovery excludes the primary, which reports no WAL receiver by definition."

  - interval: 1m
    name: a healthy three instance cluster fires neither replication alert
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="postgres",pod="postgres-1"}'
        values: '2x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: CNPGStandbyNotStreaming
        exp_alerts: []
      - eval_time: 90m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts: []

  - interval: 1m
    name: a primary streaming to one standby escalates to critical after an hour
    input_series:
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="postgres",pod="postgres-1"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts: []
      - eval_time: 90m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
              pod: postgres-1
            exp_annotations:
              summary: "CloudNativePG primary postgres/postgres-1 sees only 1 streaming standbys"
              description: "The primary postgres/postgres-1 has been streaming to fewer than the two standbys a three instance cluster expects for an hour, so the cluster is running on reduced redundancy. This is measured from the primary deliberately, because CNPGStandbyNotStreaming needs the broken standby to keep exporting metrics and cannot fire when its exporter is gone entirely."
