rule_files:
  - gap-filler-rules.gen.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: velero backup past the warning threshold fires warning only
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '-101000x200'
    alert_rule_test:
      - eval_time: 180m
        alertname: VeleroBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr has no recent successful backup"
              description: "The newest successful Velero backup for schedule daily-dr is 1d 7h 3m 20s old, exceeding the 30 hour warning threshold for the daily backup schedule."
      - eval_time: 180m
        alertname: VeleroBackupTooOldCritical
        exp_alerts: []

  - interval: 1m
    name: velero backup past the critical threshold fires critical
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '-190000x200'
    alert_rule_test:
      - eval_time: 180m
        alertname: VeleroBackupTooOldCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr has a dangerously stale backup"
              description: "The newest successful Velero backup for schedule daily-dr is 2d 7h 46m 40s old, exceeding the 50 hour critical threshold and indicating several missed daily backups."

  - interval: 1m
    name: velero backup failures raise an alert
    input_series:
      - series: 'velero_backup_failure_total{schedule="daily-dr"}'
        values: '0x60 1x60'
      - series: 'velero_backup_validation_failure_total{schedule="daily-dr"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: VeleroBackupFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              schedule: daily-dr
            exp_annotations:
              summary: "Velero schedule daily-dr is failing"
              description: "Velero schedule daily-dr recorded backup or validation failures in the last two hours, so the offsite copy is not being written."

  - interval: 1m
    name: healthy velero backups raise nothing
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="daily-dr"}'
        values: '0x200'
      - series: 'velero_backup_failure_total{schedule="daily-dr"}'
        values: '0x120'
      - series: 'velero_backup_validation_failure_total{schedule="daily-dr"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: VeleroBackupFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: VeleroBackupTooOld
        exp_alerts: []

  - interval: 1m
    name: longhorn stale backup fires warning but not critical
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc"}'
        values: '1x1900'
      - series: 'longhorn_volume_last_backup_at{volume="pvc-never"}'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 1870m
        alertname: LonghornBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc has no recent backup"
              description: "The newest Longhorn backup for volume pvc-abc is 1d 7h 9m 59s old, exceeding the 30 hour warning threshold for the nightly recurring job."
      - eval_time: 1870m
        alertname: LonghornBackupTooOldCritical
        exp_alerts: []

  - interval: 1m
    name: a never backed up volume alerts once past the grace period
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-never", pvc="kiwix-library", pvc_namespace="kiwix"}'
        values: '0x1700'
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc", pvc="n8n-data", pvc_namespace="n8n"}'
        values: '1x1700'
    alert_rule_test:
      - eval_time: 1000m
        alertname: LonghornVolumeNeverBackedUp
        exp_alerts: []
      - eval_time: 1610m
        alertname: LonghornVolumeNeverBackedUp
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-never
              pvc: kiwix-library
              pvc_namespace: kiwix
            exp_annotations:
              summary: "Longhorn volume kiwix/kiwix-library has never been backed up"
              description: "Longhorn has recorded no backup at all for volume pvc-never, claimed by kiwix/kiwix-library, for over 26 hours. The stale-backup alerts cannot see this case because they compare against the newest backup timestamp, which does not exist here. A volume in this state has no restore point whatsoever."

  - interval: 1m
    name: a longhorn backup in error state alerts
    input_series:
      - series: 'longhorn_backup_state{backup="backup-31a1b5625e944c3a", volume="pvc-f4becfb7"}'
        values: '4x120'
      - series: 'longhorn_backup_state{backup="backup-completed", volume="pvc-abc"}'
        values: '3x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              backup: backup-31a1b5625e944c3a
              volume: pvc-f4becfb7
            exp_annotations:
              summary: "Longhorn backup backup-31a1b5625e944c3a is in Error state"
              description: "Longhorn reports backup backup-31a1b5625e944c3a of volume pvc-f4becfb7 in Error state. A failed backup leaves the volume on its previous restore point, or on none at all if this was its first, and the recurring job does not retry until the next scheduled run."

  - interval: 1m
    name: longhorn degraded volume alerts
    input_series:
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '2x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc is degraded"
              description: "Longhorn reports volume pvc-abc as degraded for over 30 minutes, so it is running with fewer healthy replicas than configured."

  - interval: 1m
    name: healthy longhorn raises nothing
    input_series:
      - series: 'longhorn_volume_last_backup_at{volume="pvc-abc"}'
        values: '0x200'
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: LonghornBackupTooOld
        exp_alerts: []
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts: []

  - interval: 1m
    name: a cnpg backup wedged in a non-terminal phase alerts
    input_series:
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260724030000", phase="walArchivingFailing"}'
        values: '1x480'
    alert_rule_test:
      - eval_time: 300m
        alertname: CNPGBackupStuck
        exp_alerts: []
      - eval_time: 420m
        alertname: CNPGBackupStuck
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
              name: postgres-daily-20260724030000
              phase: walArchivingFailing
            exp_annotations:
              summary: "CloudNativePG backup postgres/postgres-daily-20260724030000 is stuck in phase walArchivingFailing"
              description: "The CloudNativePG backup postgres/postgres-daily-20260724030000 has been in the non-terminal phase walArchivingFailing for more than 6 hours. CloudNativePG never times such a backup out and a ScheduledBackup refuses to create a new one while a non-terminal backup exists, so every later run is suppressed until this object reaches a terminal phase or is deleted."

  - interval: 1m
    name: completed cnpg backups raise nothing
    input_series:
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260724030000", phase="completed"}'
        values: '1x480'
      - series: 'kube_cnpg_backup_phase_info{namespace="postgres", name="postgres-daily-20260723030000", phase="failed"}'
        values: '1x480'
    alert_rule_test:
      - eval_time: 420m
        alertname: CNPGBackupStuck
        exp_alerts: []

  - interval: 1m
    name: etcd snapshots that never reach s3 raise the upload alert only
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: an s3 snapshot that failed to upload does not count as offsite
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-etcd-snapshot-master-1", node="master", location="s3://basalt-backups/etcd-snapshots/etcd-snapshot-master-1", ready="false"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a stopped snapshot schedule raises both etcd alerts
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: current local and s3 etcd snapshots raise nothing
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-etcd-snapshot-master-1", node="master", location="s3://basalt-backups/etcd-snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts: []

  - interval: 1m
    name: on-demand snapshots do not mask a stopped schedule
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-master-1", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-master-1", ready="true"}'
        values: '0x1900'
      - series: 'kube_etcdsnapshotfile_created{name="local-on-demand-master-2", node="master", location="file:///var/lib/rancher/k3s/server/db/snapshots/on-demand-master-2", ready="true"}'
        values: '100000x1900'
      - series: 'kube_etcdsnapshotfile_created{name="s3-s3-verify-master-2", node="master", location="s3://basalt-backups/etcd-snapshots/s3-verify-master-2", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
      - eval_time: 1680m
        alertname: EtcdSnapshotNotUploaded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No scheduled k3s etcd snapshot has reached object storage"
              description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a dead exporter raises the absent guards
    input_series:
      - series: 'up{job="kube-prometheus-stack-kube-state-metrics"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "kube-state-metrics has stopped reporting"
              description: "Prometheus has held no kube_pod_info series for more than 15 minutes, so every workload, node and capacity alert derived from kube-state-metrics is unable to fire."
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Flux resource metrics have disappeared"
              description: "Prometheus has held no flux_resource_info series for more than 15 minutes, so FluxReconciliationFailure cannot fire and a stalled delivery pipeline would stay invisible."

  - interval: 1m
    name: reporting exporters raise nothing
    input_series:
      - series: 'kube_pod_info{namespace="monitoring", pod="prometheus-0"}'
        values: '1x60'
      - series: 'flux_resource_info{kind="Kustomization", name="apps", exported_namespace="flux-system", ready="True", suspended="False"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxReconciliationFailure
        exp_alerts: []
