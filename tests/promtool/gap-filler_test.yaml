rule_files:
  - gap-filler-rules.gen.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: longhorn degraded volume alerts
    input_series:
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '2x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc is degraded"
              description: "Longhorn reports volume pvc-abc as degraded for over 30 minutes, so it is running with fewer healthy replicas than configured."

  - interval: 1m
    name: healthy longhorn raises nothing
    input_series:
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts: []

  - interval: 1m
    name: a stopped snapshot schedule raises the etcd snapshot age alert
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-control-plane-1-1", node="control-plane-1", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-control-plane-1-1", ready="true"}'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a current local etcd snapshot raises nothing
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-control-plane-1-1", node="control-plane-1", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-control-plane-1-1", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts: []

  - interval: 1m
    name: slow etcd wal fsync alerts but healthy fsync does not
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.016"}'
        values: '0+60x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.128"}'
        values: '0+60x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="+Inf"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: EtcdWalFsyncSlow
        exp_alerts: []

  - interval: 1m
    name: etcd wal fsync above the threshold alerts
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.016"}'
        values: '0+0x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="0.128"}'
        values: '0+59x120'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{le="+Inf"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: EtcdWalFsyncSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "etcd WAL fsync p99 is above 100ms"
              description: "The p99 etcd WAL fsync duration has exceeded 100 milliseconds for 15 minutes, against a 10 millisecond target for healthy etcd. etcd shares one NVMe with the Longhorn replica data on control-plane-1, so sustained slow fsync usually means storage contention rather than an etcd fault. The upstream etcdHighFsyncDurations alert only fires at 500 milliseconds, which is far above the range this estate operates in and would miss this entirely."

  - interval: 1m
    name: on-demand snapshots do not mask a stopped schedule
    input_series:
      - series: 'kube_etcdsnapshotfile_created{name="local-etcd-snapshot-control-plane-1-1", node="control-plane-1", location="file:///var/lib/rancher/k3s/server/db/snapshots/etcd-snapshot-control-plane-1-1", ready="true"}'
        values: '0x1900'
      - series: 'kube_etcdsnapshotfile_created{name="local-on-demand-control-plane-1-2", node="control-plane-1", location="file:///var/lib/rancher/k3s/server/db/snapshots/on-demand-control-plane-1-2", ready="true"}'
        values: '100000x1900'
    alert_rule_test:
      - eval_time: 1680m
        alertname: EtcdSnapshotTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "k3s has recorded no recent scheduled etcd snapshot"
              description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."

  - interval: 1m
    name: a dead exporter raises the absent guards
    input_series:
      - series: 'up{job="kube-prometheus-stack-kube-state-metrics"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "kube-state-metrics has stopped reporting"
              description: "Prometheus has held no kube_pod_info series for more than 15 minutes, so every workload, node and capacity alert derived from kube-state-metrics is unable to fire."
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Flux resource metrics have disappeared"
              description: "Prometheus has held no flux_resource_info series for more than 15 minutes, so FluxReconciliationFailure cannot fire and a stalled delivery pipeline would stay invisible."

  - interval: 1m
    name: reporting exporters raise nothing
    input_series:
      - series: 'kube_pod_info{namespace="monitoring", pod="prometheus-0"}'
        values: '1x60'
      - series: 'flux_resource_info{kind="Kustomization", name="apps", exported_namespace="flux-system", ready="True", suspended="False"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: FluxReconciliationFailure
        exp_alerts: []

  - interval: 1m
    name: longhorn scheduling headroom past the warning threshold fires warning only
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-1"}'
        values: '190x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-1"}'
        values: '100x200'
      - series: 'longhorn_node_storage_reservation_bytes{node="worker-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              node: worker-1
            exp_annotations:
              summary: "Longhorn node worker-1 has little replica scheduling headroom left"
              description: "Longhorn has already promised 95 percent of the schedulable budget on node worker-1, where the budget is disk capacity minus the per-disk reservation Longhorn withholds from scheduling, multiplied by the 200 percent over-provisioning factor Longhorn applies to declared replica sizes. This counts space promised to volumes rather than bytes written, so the disk is not filling up, and a separate minimum-available check measured on real bytes stops scheduling if it ever does. What it bounds is provisioning: with hard replica anti-affinity and allowVolumeCreationWithDegradedAvailability disabled, Longhorn refuses to schedule any new replica on this node once this reaches 100 percent, though existing volumes keep working undisturbed; once every node reaches 100 percent no new three-replica volume can be created anywhere in the cluster."
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomCritical
        exp_alerts: []

  - interval: 1m
    name: longhorn scheduling headroom past the critical threshold fires critical
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-1"}'
        values: '196x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-1"}'
        values: '100x200'
      - series: 'longhorn_node_storage_reservation_bytes{node="worker-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              node: worker-1
            exp_annotations:
              summary: "Longhorn node worker-1 is almost out of replica scheduling headroom"
              description: "Longhorn has promised 98 percent of the schedulable budget on node worker-1, where the budget is disk capacity minus the per-disk reservation Longhorn withholds from scheduling, multiplied by the 200 percent over-provisioning factor Longhorn applies to declared replica sizes. New three-replica volume creation is about to fail cluster-wide. Free space by deleting unused volumes or their orphaned replicas, reduce an over-declared volume, or expand the disk."

  - interval: 1m
    name: longhorn scheduled past raw capacity but inside the over-provisioned budget fires nothing
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-2"}'
        values: '102x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-2"}'
        values: '100x200'
      - series: 'longhorn_node_storage_reservation_bytes{node="worker-2"}'
        values: '0x200'
    promql_expr_test:
      - expr: longhorn:node_replica_scheduling:budget_used_percent
        eval_time: 90m
        exp_samples:
          - labels: 'longhorn:node_replica_scheduling:budget_used_percent{node="worker-2"}'
            value: 51
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomLow
        exp_alerts: []

  - interval: 1m
    name: longhorn headroom past 90 percent of the reserved budget fires despite sitting under 90 percent of raw capacity
    input_series:
      - series: 'longhorn_node_storage_scheduled_bytes{node="worker-1"}'
        values: '152x200'
      - series: 'longhorn_node_storage_capacity_bytes{node="worker-1"}'
        values: '100x200'
      - series: 'longhorn_node_storage_reservation_bytes{node="worker-1"}'
        values: '20x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornSchedulingHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: warning
              node: worker-1
            exp_annotations:
              summary: "Longhorn node worker-1 has little replica scheduling headroom left"
              description: "Longhorn has already promised 95 percent of the schedulable budget on node worker-1, where the budget is disk capacity minus the per-disk reservation Longhorn withholds from scheduling, multiplied by the 200 percent over-provisioning factor Longhorn applies to declared replica sizes. This counts space promised to volumes rather than bytes written, so the disk is not filling up, and a separate minimum-available check measured on real bytes stops scheduling if it ever does. What it bounds is provisioning: with hard replica anti-affinity and allowVolumeCreationWithDegradedAvailability disabled, Longhorn refuses to schedule any new replica on this node once this reaches 100 percent, though existing volumes keep working undisturbed; once every node reaches 100 percent no new three-replica volume can be created anywhere in the cluster."

  - interval: 1m
    name: a disk longhorn itself marks unschedulable alerts while a schedulable one stays quiet
    input_series:
      - series: 'longhorn_disk_status{condition="schedulable",disk="default-disk",node="worker-1"}'
        values: '0x200'
      - series: 'longhorn_disk_status{condition="schedulable",disk="default-disk",node="worker-2"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: LonghornDiskUnschedulable
        exp_alerts:
          - exp_labels:
              severity: warning
              node: worker-1
              disk: default-disk
            exp_annotations:
              summary: "Longhorn has marked disk default-disk on node worker-1 unschedulable"
              description: "Longhorn itself reports that it will place no further replica on disk default-disk on node worker-1, whether because the declared budget is exhausted or because real free space fell below the minimum-available floor. This reads Longhorn's own verdict rather than re-deriving its arithmetic, so it holds whatever the over-provisioning and reservation settings are, and it stays correct when the scheduling-headroom expressions no longer do."

  - interval: 1m
    name: node temperature past the warning threshold fires warning only
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="control-plane-1",chip="platform_coretemp_0",sensor="temp1"}'
        values: '78x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: control-plane-1
            exp_annotations:
              summary: "Node control-plane-1 is running hot"
              description: "The hottest sensor on control-plane-1 has read 78 degrees Celsius for over 15 minutes, well above the 45 to 60 degree band these nodes sit in at rest. The usual causes are a blocked intake, a failing fan or a sustained workload."
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts: []

  - interval: 1m
    name: node temperature past the critical threshold fires critical
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="worker-2",chip="platform_coretemp_0",sensor="temp1"}'
        values: '90x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: worker-2
            exp_annotations:
              summary: "Node worker-2 is close to thermal throttling"
              description: "The hottest sensor on worker-2 has read 90 degrees Celsius for over 5 minutes. Sustained temperatures at this level throttle the CPU and shorten hardware life."

  - interval: 1m
    name: the router is excluded from temperature alerting
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="pi-router",chip="platform_soc",sensor="temp1"}'
        values: '90x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCpuTemperatureHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeCpuTemperatureCritical
        exp_alerts: []

  - interval: 1m
    name: container memory past the warning threshold fires warning only
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik",pod="authentik-server-0",container="server"}'
        values: '90x200'
      - series: 'kube_pod_container_resource_limits{namespace="authentik",pod="authentik-server-0",container="server",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              pod: authentik-server-0
              container: server
            exp_annotations:
              summary: "Container server in authentik/authentik-server-0 is close to its memory limit"
              description: "Container server has held above 85 percent of its memory limit for 30 minutes, currently 90%. Exceeding the limit is an immediate OOMKill rather than a gradual slowdown, so this is the only warning available before the container is terminated. Either the limit was set below what the workload needs or the workload is leaking."
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts: []

  - interval: 1m
    name: container memory past the critical threshold fires critical
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="llm",pod="open-webui-0",container="open-webui"}'
        values: '98x200'
      - series: 'kube_pod_container_resource_limits{namespace="llm",pod="open-webui-0",container="open-webui",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: llm
              pod: open-webui-0
              container: open-webui
            exp_annotations:
              summary: "Container open-webui in llm/open-webui-0 is about to be OOMKilled"
              description: "Container open-webui has held above 95 percent of its memory limit for 10 minutes, currently 98%. Raise the limit or restart the workload before the kernel does it."

  - interval: 1m
    name: a container comfortably inside its memory limit fires nothing
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="monitoring",pod="loki-0",container="loki"}'
        values: '40x200'
      - series: 'kube_pod_container_resource_limits{namespace="monitoring",pod="loki-0",container="loki",resource="memory"}'
        values: '100x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 60m
        alertname: ContainerMemoryAtLimit
        exp_alerts: []

  - interval: 1m
    name: a container with no declared limit is not evaluated
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="longhorn-system",pod="longhorn-ui-0",container="longhorn-ui"}'
        values: '900x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  - interval: 1m
    name: a restart whose previous instance was OOMKilled fires critical
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="metallb-system",pod="metallb-controller-0",container="controller"}'
        values: '0+1x200'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="metallb-system",pod="metallb-controller-0",container="controller",reason="OOMKilled"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: metallb-system
              pod: metallb-controller-0
              container: controller
            exp_annotations:
              summary: "Container controller in metallb-system/metallb-controller-0 was OOMKilled"
              description: "Container controller restarted in the last hour and its previous instance was terminated for exceeding its memory limit. The limit is wrong or the workload is leaking; the container will keep being killed until one of the two is corrected."

  - interval: 1m
    name: a restart for a reason other than OOM does not fire
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="blog",pod="blog-0",container="blog"}'
        values: '0+1x200'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="blog",pod="blog-0",container="blog",reason="Error"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerOOMKilled
        exp_alerts: []

  - interval: 1m
    name: a standby that stops streaming fires while the primary and the healthy standby stay quiet
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-3"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-3"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGStandbyNotStreaming
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: postgres
              pod: postgres-3
            exp_annotations:
              summary: "CloudNativePG standby postgres/postgres-3 has stopped streaming"
              description: "The standby postgres/postgres-3 has no WAL receiver, so it is no longer replicating from the primary. Nothing else reports this: the pod stays Running and Ready because the instance manager is healthy, readyInstances still counts it, and quorum synchronous replication is satisfied by the remaining standby, so writes never degrade. A standby in this state silently stops being a copy of the data. The match on cnpg_pg_replication_in_recovery excludes the primary, which reports no WAL receiver by definition."

  - interval: 1m
    name: a healthy three instance cluster fires neither replication alert
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="postgres",pod="postgres-1"}'
        values: '2x200'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: CNPGStandbyNotStreaming
        exp_alerts: []
      - eval_time: 90m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts: []

  - interval: 1m
    name: a primary streaming to one standby escalates to critical after an hour
    input_series:
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="postgres",pod="postgres-1"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts: []
      - eval_time: 90m
        alertname: CNPGStreamingReplicasBelowExpected
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
              pod: postgres-1
            exp_annotations:
              summary: "CloudNativePG primary postgres/postgres-1 sees only 1 streaming standbys"
              description: "The primary postgres/postgres-1 has been streaming to fewer than the two standbys a three instance cluster expects for an hour, so the cluster is running on reduced redundancy. This is measured from the primary deliberately, because CNPGStandbyNotStreaming needs the broken standby to keep exporting metrics and cannot fire when its exporter is gone entirely."

  - interval: 1m
    name: a stalled HelmRelease fires critical after five minutes
    input_series:
      - series: 'flux_resource_info{kind="HelmRelease",name="cloudnative-pg",exported_namespace="cnpg-system",ready="False",reason="UpgradeFailed",suspended="False"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: HelmReleaseStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              name: cloudnative-pg
              exported_namespace: cnpg-system
              reason: UpgradeFailed
            exp_annotations:
              summary: "HelmRelease cnpg-system/cloudnative-pg is stalled"
              description: "The HelmRelease cnpg-system/cloudnative-pg has reported Ready=False for over 5 minutes, most recently with reason UpgradeFailed. Some HelmReleases in this cluster set remediateLastFailure to false so a failed upgrade stays deployed instead of rolling back, and once retries are exhausted the release stops changing on its own. FluxReconciliationFailure already reports the same condition for every Flux kind at warning severity behind a twelve hour digest; this alert covers HelmRelease specifically at critical severity so a stalled release reaches a human promptly instead of waiting in that digest."

  - interval: 1m
    name: a ready HelmRelease raises nothing
    input_series:
      - series: 'flux_resource_info{kind="HelmRelease",name="cloudnative-pg",exported_namespace="cnpg-system",ready="True",reason="UpgradeSucceeded",suspended="False"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: HelmReleaseStalled
        exp_alerts: []

  - interval: 1m
    name: a suspended HelmRelease does not stall alert
    input_series:
      - series: 'flux_resource_info{kind="HelmRelease",name="cloudnative-pg",exported_namespace="cnpg-system",ready="False",reason="UpgradeFailed",suspended="True"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: HelmReleaseStalled
        exp_alerts: []

  - interval: 1m
    name: a container stuck pulling its image fires critical after ten minutes
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="litellm",pod="litellm-0",container="app",reason="ImagePullBackOff"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerImagePullBackOff
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: litellm
              pod: litellm-0
              container: app
              reason: ImagePullBackOff
            exp_annotations:
              summary: "Container app in litellm/litellm-0 cannot pull its image"
              description: "Container app in litellm/litellm-0 has been stuck in ImagePullBackOff for over 10 minutes, which covers both a wrong image reference and a registry rejecting pulls under rate limiting. The upstream KubeContainerWaiting alert treats every waiting reason alike and only fires after an hour, which missed the incident this alert is built to catch."

  - interval: 1m
    name: a running container raises no image pull alert
    input_series:
      - series: 'kube_pod_container_status_running{namespace="litellm",pod="litellm-0",container="app"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerImagePullBackOff
        exp_alerts: []

  - interval: 1m
    name: a container waiting for a reason other than image pull raises nothing
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="litellm",pod="litellm-0",container="app",reason="CrashLoopBackOff"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerImagePullBackOff
        exp_alerts: []

  - interval: 1m
    name: the tailscale0 interface being recreated flags flannel as orphaned
    input_series:
      - series: 'node_network_iface_id{job="node-exporter",instance="worker-1",device="tailscale0"}'
        values: '5x14 6x60'
      - series: 'node_boot_time_seconds{job="node-exporter",instance="worker-1"}'
        values: '1000x200'
    alert_rule_test:
      - eval_time: 25m
        alertname: FlannelInterfaceOrphaned
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: worker-1
              device: tailscale0
              job: node-exporter
            exp_annotations:
              summary: "Node worker-1 tailscale0 interface was recreated without a reboot"
              description: "The tailscale0 interface index on worker-1 changed in the last 15 minutes while the node's boot time did not, which happens when tailscaled restarts and rebuilds the tunnel but k3s does not restart alongside it. flannel.1 stays bound to the old interface and nothing recreates it automatically, so the node stays Ready while its pods can reach nothing over the overlay. A full reboot also changes this interface's index, but it changes the node's boot time too and k3s restarts in step with tailscaled, so that case is excluded. Check the node's flannel.alpha.coreos.com/public-ip annotation and delete flannel.1 to force a rebind, per the disaster-recovery runbook."

  - interval: 1m
    name: a stable tailscale0 interface raises nothing
    input_series:
      - series: 'node_network_iface_id{job="node-exporter",instance="worker-1",device="tailscale0"}'
        values: '5x200'
      - series: 'node_boot_time_seconds{job="node-exporter",instance="worker-1"}'
        values: '1000x200'
    alert_rule_test:
      - eval_time: 25m
        alertname: FlannelInterfaceOrphaned
        exp_alerts: []

  - interval: 1m
    name: a full reboot recreates tailscale0 with a fresh ifindex and must not fire
    input_series:
      - series: 'node_network_iface_id{job="node-exporter",instance="worker-1",device="tailscale0"}'
        values: '5x14 6x60'
      - series: 'node_boot_time_seconds{job="node-exporter",instance="worker-1"}'
        values: '1000x14 2000x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: FlannelInterfaceOrphaned
        exp_alerts: []

  - interval: 1m
    name: the pi router is excluded from the flannel orphan check
    input_series:
      - series: 'node_network_iface_id{job="pi-router",instance="pi-router",device="tailscale0"}'
        values: '5x14 6x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: FlannelInterfaceOrphaned
        exp_alerts: []

  - interval: 1m
    name: a standby lagging behind the primary fires warning after fifteen minutes
    input_series:
      - series: 'cnpg_pg_stat_replication_replay_lag_seconds{namespace="postgres",pod="postgres-1",application_name="postgres-2"}'
        values: '45x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGReplicationLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: postgres
              pod: postgres-1
              application_name: postgres-2
            exp_annotations:
              summary: "CloudNativePG standby postgres-2 is lagging behind postgres/postgres-1"
              description: "The primary postgres/postgres-1 has reported standby postgres-2 more than 30 seconds behind on WAL replay for 15 minutes. A lagging standby is still streaming and does not trip CNPGStandbyNotStreaming, but it holds stale data and would lose recent transactions if promoted while behind."

  - interval: 1m
    name: a standby within the lag threshold raises nothing
    input_series:
      - series: 'cnpg_pg_stat_replication_replay_lag_seconds{namespace="postgres",pod="postgres-1",application_name="postgres-2"}'
        values: '2x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGReplicationLagHigh
        exp_alerts: []

  - interval: 1m
    name: a standby promoted to primary fires the failover alert
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x14 0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: CNPGFailoverDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
              pod: postgres-2
            exp_annotations:
              summary: "CloudNativePG instance postgres/postgres-2 was promoted"
              description: "Instance postgres/postgres-2 left recovery mode in the last 15 minutes, meaning it was promoted from standby to primary. This fires for both an automatic failover and a manual switchover, because the replication state it is built on cannot tell the two apart; either way the cluster's primary changed and is worth a look."

  - interval: 1m
    name: a stable cluster with no promotions raises nothing
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-2"}'
        values: '1x200'
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 60m
        alertname: CNPGFailoverDetected
        exp_alerts: []

  - interval: 1m
    name: a faulted longhorn volume alerts where the degraded rule cannot
    input_series:
      - series: 'longhorn_volume_robustness{volume="pvc-abc"}'
        values: '3x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeFaulted
        exp_alerts:
          - exp_labels:
              severity: critical
              volume: pvc-abc
            exp_annotations:
              summary: "Longhorn volume pvc-abc is faulted"
              description: "Longhorn reports volume pvc-abc as faulted, meaning no replica is usable and the volume can serve neither reads nor writes. LonghornVolumeDegraded cannot stand in for this on a single-replica volume, which has no degraded state to pass through and moves straight from healthy to faulted."
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts: []

  - interval: 1m
    name: an unschedulable longhorn volume alerts while its other false conditions stay quiet
    input_series:
      - series: 'kube_longhornvolume_status_condition{name="pvc-abc",pvc="data-zot-0",pvc_namespace="zot",type="Scheduled"}'
        values: '0x120'
      - series: 'kube_longhornvolume_status_condition{name="pvc-abc",pvc="data-zot-0",pvc_namespace="zot",type="Restore"}'
        values: '0x120'
      - series: 'kube_longhornvolume_status_condition{name="pvc-abc",pvc="data-zot-0",pvc_namespace="zot",type="TooManySnapshots"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeUnschedulable
        exp_alerts:
          - exp_labels:
              severity: warning
              name: pvc-abc
              pvc: data-zot-0
              pvc_namespace: zot
              type: Scheduled
            exp_annotations:
              summary: "Longhorn cannot place every replica of zot/data-zot-0"
              description: "Longhorn has reported the Scheduled condition false on the volume backing zot/data-zot-0 for over 30 minutes, meaning no disk has enough scheduling budget for at least one replica the volume wants. The volume keeps serving from the replicas it already has, so nothing fails visibly; what it loses is the redundancy or the data locality it was configured for. Longhorn exports no metric for this condition, so this reads it from the volume's own status through kube-state-metrics."

  - interval: 1m
    name: a schedulable longhorn volume raises nothing
    input_series:
      - series: 'kube_longhornvolume_status_condition{name="pvc-abc",pvc="data-zot-0",pvc_namespace="zot",type="Scheduled"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: LonghornVolumeUnschedulable
        exp_alerts: []

  - interval: 1m
    name: a volume declaring far more than it stores alerts once the wasted budget is material
    input_series:
      - series: 'kube_longhornvolume_declared_bytes{name="pvc-abc",pvc="paperless-ngx-media",pvc_namespace="paperless"}'
        values: '21474836480x200'
      - series: 'kube_longhornvolume_actual_bytes{name="pvc-abc",pvc="paperless-ngx-media",pvc_namespace="paperless"}'
        values: '480000000x200'
      - series: 'kube_longhornvolume_replicas{name="pvc-abc",pvc="paperless-ngx-media",pvc_namespace="paperless"}'
        values: '3x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornVolumeOverDeclared
        exp_alerts:
          - exp_labels:
              severity: warning
              name: pvc-abc
              pvc: paperless-ngx-media
              pvc_namespace: paperless
            exp_annotations:
              summary: "Longhorn volume paperless/paperless-ngx-media declares far more than it stores"
              description: "The volume backing paperless/paperless-ngx-media declares more than ten times what it holds, and the gap costs over 20 GB of scheduling budget once multiplied by its replica count. Longhorn charges a replica its declared size the moment it is placed, whatever the volume contains, so an over-declaration is spent budget rather than spare room. Longhorn expands but never shrinks, so correcting one means recreating the claim, which is worth doing only for a volume whose declaration is wrong rather than merely generous."

  - interval: 1m
    name: a small volume with a high ratio stays quiet because the wasted budget is trivial
    input_series:
      - series: 'kube_longhornvolume_declared_bytes{name="pvc-abc",pvc="paperless-ai",pvc_namespace="paperless"}'
        values: '2147483648x200'
      - series: 'kube_longhornvolume_actual_bytes{name="pvc-abc",pvc="paperless-ai",pvc_namespace="paperless"}'
        values: '100000000x200'
      - series: 'kube_longhornvolume_replicas{name="pvc-abc",pvc="paperless-ai",pvc_namespace="paperless"}'
        values: '3x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornVolumeOverDeclared
        exp_alerts: []

  - interval: 1m
    name: a large volume in genuine use stays quiet even though its unused gap exceeds the budget floor
    input_series:
      - series: 'kube_longhornvolume_declared_bytes{name="pvc-abc",pvc="kiwix-library",pvc_namespace="kiwix"}'
        values: '107374182400x200'
      - series: 'kube_longhornvolume_actual_bytes{name="pvc-abc",pvc="kiwix-library",pvc_namespace="kiwix"}'
        values: '64000000000x200'
      - series: 'kube_longhornvolume_replicas{name="pvc-abc",pvc="kiwix-library",pvc_namespace="kiwix"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: LonghornVolumeOverDeclared
        exp_alerts: []

  - interval: 1m
    name: a node whose podCIDR no networkpolicy allows fires critical
    input_series:
      - series: 'kube_node_info{node="control-plane-2",pod_cidr="10.42.8.0/24",internal_ip="10.20.0.13"}'
        values: '1x60'
      - series: 'kube_node_info{node="worker-1",pod_cidr="10.42.1.0/24",internal_ip="10.20.0.11"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodePodCidrOutsideAllowlist
        exp_alerts:
          - exp_labels:
              severity: critical
              node: control-plane-2
              pod_cidr: 10.42.8.0/24
              internal_ip: 10.20.0.13
            exp_annotations:
              summary: "Node control-plane-2 holds podCIDR 10.42.8.0/24, which no NetworkPolicy allows"
              description: "The NetworkPolicies that admit host-originated traffic into longhorn-system, cattle-system and postgres enumerate each node's flannel gateway pair as 10.42.N.0/32 and 10.42.N.1/32 for N from 0 to 7, because host traffic reaches a pod from cni0 or flannel.1 and never from the node's LAN address. Node control-plane-2 now holds a podCIDR outside that range, so its kubelet and, on a control plane, its API server cannot reach pods in those namespaces. That presents as admission webhooks failing closed rather than as a network error. Widen the allowlists in the three networkpolicies files before the next reconcile depends on this node."

  - interval: 1m
    name: an instance manager set that never drained after an upgrade alerts
    input_series:
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-1",instance_manager="instance-manager-old"}'
        values: '672x2000'
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-1",instance_manager="instance-manager-new"}'
        values: '672x2000'
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="control-plane-1",instance_manager="instance-manager-only"}'
        values: '600x2000'
    alert_rule_test:
      - eval_time: 1500m
        alertname: LonghornInstanceManagerNotDrained
        exp_alerts:
          - exp_labels:
              severity: warning
              node: worker-1
            exp_annotations:
              summary: "Node worker-1 still runs 2 Longhorn instance managers a day after an upgrade"
              description: "A Longhorn upgrade deploys a second set of instance managers and releases the old set only once every volume still holding an engine there is detached. After a day the old set is pinned, not draining, and it keeps reserving guaranteedInstanceManagerCPU percent of the node's allocatable CPU while doing no work. Detach and reattach the volumes whose engines still run on the older instance manager. One per node is correct while the v2 data engine stays disabled."

  - interval: 1m
    name: a second instance manager set inside the upgrade window stays quiet
    input_series:
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-1",instance_manager="instance-manager-old"}'
        values: '672x2000'
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-1",instance_manager="instance-manager-new"}'
        values: '672x2000'
    alert_rule_test:
      - eval_time: 600m
        alertname: LonghornInstanceManagerNotDrained
        exp_alerts: []

  - interval: 1m
    name: one instance manager per node raises nothing
    input_series:
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-1",instance_manager="instance-manager-a"}'
        values: '672x2000'
      - series: 'longhorn_instance_manager_cpu_requests_millicpu{node="worker-2",instance_manager="instance-manager-b"}'
        values: '1392x2000'
    alert_rule_test:
      - eval_time: 1500m
        alertname: LonghornInstanceManagerNotDrained
        exp_alerts: []

  - interval: 1m
    name: a base backup older than two days alerts even while the cluster reports success
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="postgres",pod="postgres-1"}'
        values: '-259200x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: CNPGBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgres
            exp_annotations:
              summary: "CloudNativePG has taken no base backup in postgres for 3 days"
              description: "The newest base backup CloudNativePG can recover from is more than two days old, against a nightly schedule. This reads the recovery point rather than the outcome of the last run, because the cluster reported LastBackupSucceeded true for 43 days while its destination no longer existed and every WAL archive was counted as a success into nothing. Recovery without a usable base backup falls back to a crash-consistent Longhorn snapshot, which rolls all three instances back together and cannot recover from a logical fault."
      - eval_time: 90m
        alertname: CNPGBackupNotConfigured
        exp_alerts: []

  - interval: 1m
    name: no backup recovery point at all alerts separately from a stale one
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="postgres",pod="postgres-1"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: CNPGBackupNotConfigured
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "CloudNativePG is exporting no backup recovery point at all"
              description: "The metric carrying the newest recoverable backup has disappeared entirely, which happens when CloudNativePG itself stops exporting it, not when its backup configuration is removed: verified live, a cluster with spec.backup unset keeps exporting the last timestamp the collector ever saw, so removing the configuration alone never triggers this. This covers the exporter or the cluster going away outright. CNPGBackupStale cannot fire on an absent series, so this is what notices when the signal itself, not just a fresh point on it, is gone."
      - eval_time: 90m
        alertname: CNPGBackupStale
        exp_alerts: []

  - interval: 1m
    name: a job with failed pods alerts while a job with none stays quiet
    input_series:
      - series: 'kube_job_status_failed{namespace="longhorn-system",job_name="snapshot-29819610"}'
        values: '2x60'
      - series: 'kube_job_status_failed{namespace="kyverno",job_name="kyverno-migrate-resources"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: longhorn-system
              job_name: snapshot-29819610
            exp_annotations:
              summary: "Job longhorn-system/snapshot-29819610 failed to complete"
              description: "The Job longhorn-system/snapshot-29819610 has recorded 2 failed pods for over 15 minutes. This replaces the mixin alert of the same name, which queried kube_job_failed, a metric kube-state-metrics does not export; the exported series is kube_job_status_failed and carries a failure count rather than a boolean. Deleting the Job after investigation clears this."

  - interval: 1m
    name: cert-manager alerts name the certificate's namespace not the exporter's
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="traefik",name="wildcard-syslabs-dev"}'
        values: '610200x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: CertManagerCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cert-manager
              exported_namespace: traefik
              name: wildcard-syslabs-dev
            exp_annotations:
              summary: "Certificate traefik/wildcard-syslabs-dev expires in less than 14 days"
              description: "The cert-manager certificate traefik/wildcard-syslabs-dev expires in 7d 0h 0m 0s."
      - eval_time: 90m
        alertname: CertManagerCertExpired
        exp_alerts: []

  - interval: 1m
    name: an expired certificate alerts critical against the certificate's namespace
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager",exported_namespace="traefik",name="wildcard-syslabs-dev"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: CertManagerCertExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: cert-manager
              exported_namespace: traefik
              name: wildcard-syslabs-dev
            exp_annotations:
              summary: "Certificate traefik/wildcard-syslabs-dev has expired"
              description: "The cert-manager certificate traefik/wildcard-syslabs-dev expired 1h 30m 0s ago."
