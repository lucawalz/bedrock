apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Centralized namespace definitions
# These are created before secrets and apps to ensure namespaces exist
resources:
  - postgres.yaml
  - cnpg-system.yaml
  - traefik.yaml
  - metallb-system.yaml
  - cert-manager.yaml
  - cloudflare-tunnel.yaml
  - monitoring.yaml
  - longhorn-system.yaml
  - authentik.yaml
  - reloader.yaml
  - kyverno.yaml
  - flagger.yaml
  - zot.yaml
  - default.yaml
  - default-serviceaccounts.yaml
