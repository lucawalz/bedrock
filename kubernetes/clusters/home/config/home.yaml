---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-cnpg-db
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/configs/cnpg
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-cnpg-operator
    - name: cluster-secrets
    - name: cluster-namespaces
    - name: cluster-crds
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-pocket-id-db
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/controllers/pocket-id/db
  targetNamespace: postgres
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-cnpg-db
  # no failed expression: a Database reports applied false until its owner role exists, which is transient here
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied && status.observedGeneration == metadata.generation
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied && status.observedGeneration == metadata.generation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-pocket-id
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/controllers/pocket-id/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-edge-onprem
    - name: cluster-namespaces
    - name: cluster-secrets
    - name: cluster-pocket-id-db
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-pocket-id-clients
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/controllers/pocket-id/clients
  prune: true
  wait: true
  timeout: 5m
  # Job pod templates are immutable, so a changed client list or script needs the Job recreated
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-pocket-id
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-oauth2-proxy
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/controllers/oauth2-proxy
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-edge-onprem
    - name: cluster-namespaces
    - name: cluster-secrets
    - name: cluster-pocket-id-clients
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-reaper
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/configs/reaper
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-namespaces
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-flux
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/clusters/home/flux-operator/instance
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-flux-operator
    - name: cluster-edge-onprem
