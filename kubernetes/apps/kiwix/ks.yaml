apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kiwix
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/kiwix/app
  prune: true
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-edge-onprem
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
