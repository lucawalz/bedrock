apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiwix
  namespace: kiwix
spec:
  interval: 30m
  timeout: 3h
  chart:
    spec:
      chart: app-template
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    controllers:
      kiwix:
        strategy: Recreate
        initContainers:
          fetch:
            image:
              repository: alpine
              tag: "3.23"
            command:
              - sh
              - -euc
              - |
                cd /library
                mirror=https://download.kiwix.org/zim

                fetch() {
                  dir="$${1}"
                  prefix="$${2}"
                  name=$$(wget -qO- "$${mirror}/$${dir}/" \
                    | grep -oE "$${prefix}[0-9-]+\.zim" | sort -u | tail -1)
                  if [ -z "$${name}" ]; then
                    echo "could not resolve $${prefix} in $${dir}" >&2
                    return 1
                  fi
                  if ls "$${prefix}"*.zim >/dev/null 2>&1; then
                    echo "have $$(ls "$${prefix}"*.zim), skipping"
                    return 0
                  fi
                  echo "downloading $${name}"
                  wget -q -c -O "$${name}.part" "$${mirror}/$${dir}/$${name}"
                  mv "$${name}.part" "$${name}"
                }

                fetch wikipedia wikipedia_en_all_mini_
                fetch wikipedia wikipedia_de_all_mini_
                fetch wikipedia wikipedia_en_medicine_maxi_
                fetch ifixit    ifixit_en_all_
                fetch other     zimgit-post-disaster_en_
                fetch other     wikem_en_all_maxi_
                fetch other     archlinux_en_all_maxi_

                rm -f ./*.part
                df -h /library
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "2"
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          library:
            image:
              repository: ghcr.io/kiwix/kiwix-tools
              tag: "3.8.2"
            command:
              - sh
              - -euc
              - |
                cd /library
                rm -f library.xml
                for z in *.zim; do
                  [ -e "$${z}" ] || continue
                  kiwix-manage library.xml add "$${z}"
                done
                kiwix-manage library.xml show | head -40
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/kiwix/kiwix-tools
              tag: "3.8.2"
            command:
              - /usr/bin/dumb-init
              - --
              - /usr/local/bin/kiwix-serve
            args:
              - --port=8080
              - --monitorLibrary
              - --library
              - /library/library.xml
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kiwix
        ports:
          http:
            port: 8080
    persistence:
      library:
        existingClaim: kiwix-library
        globalMounts:
          - path: /library
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
