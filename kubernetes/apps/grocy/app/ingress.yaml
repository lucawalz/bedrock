apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grocy
  namespace: grocy
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grocy
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: grocy.png
    gethomepage.dev/href: https://grocy.${cluster_domain}
    gethomepage.dev/podSelector: app.kubernetes.io/name=grocy
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # the native app authenticates with an API key and cannot complete a forward-auth flow
    - match: Host(`grocy.${cluster_domain}`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 20
      services:
        - name: grocy
          port: 8080
    - match: Host(`grocy.${cluster_domain}`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forward-auth
      services:
        - name: grocy
          port: 8080
  tls: {}
