apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grocy
  namespace: grocy
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grocy
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: grocy.png
    gethomepage.dev/href: https://grocy.${cluster_domain}
    gethomepage.dev/podSelector: app.kubernetes.io/name=grocy
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # forward auth would redirect to an internally resolvable host, which a client outside the tailnet cannot reach
    - match: Host(`grocy.${cluster_domain}`)
      kind: Rule
      services:
        - name: grocy
          port: 8080
  tls: {}
