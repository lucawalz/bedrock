apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: llm
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: open-webui
      version: "16.5.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    fullnameOverride: open-webui
    replicaCount: 1
    podLabels:
      bedrock.io/postgres-client: "true"
    extraEnvVars:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: open-webui-postgres
            key: DATABASE_URL
      - name: ENABLE_SIGNUP
        value: "false"
      - name: DEFAULT_USER_ROLE
        value: pending
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi
    copyAppData:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    ollama:
      enabled: false
    ollamaUrls:
      - http://ollama.llm.svc.cluster.local:11434
    pipelines:
      enabled: false
    websocket:
      enabled: false
    persistence:
      enabled: true
      existingClaim: open-webui-encrypted
    # the model cache is refetched on start so it never reaches the backed-up volume
    volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 2Gi
    volumeMounts:
      initContainer:
        - name: model-cache
          mountPath: /tmp/app-data/cache
      container:
        - name: model-cache
          mountPath: /app/backend/data/cache
    ingress:
      enabled: false
    service:
      type: ClusterIP
      port: 80
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: 0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
