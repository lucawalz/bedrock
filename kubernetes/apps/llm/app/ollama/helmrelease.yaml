apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: llm
spec:
  interval: 30m
  timeout: 60m
  chart:
    spec:
      chart: ollama
      version: "1.95.0"
      sourceRef:
        kind: HelmRepository
        name: ollama
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    ollama:
      gpu:
        enabled: false
      models:
        pull:
          - llama3.2:3b
          - qwen2.5:7b
          - nomic-embed-text
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    service:
      type: ClusterIP
      port: 11434
    ingress:
      enabled: false
    persistentVolume:
      enabled: true
      size: 12Gi
      storageClass: longhorn-disposable
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: "250m"
        memory: "4Gi"
      limits:
        cpu: "4000m"
        memory: "16Gi"
    image:
      repository: docker.io/ollama/ollama
      tag: 0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    tests:
      enabled: false
    serviceAccount:
      automount: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ollama
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 3600
          - target:
              kind: PersistentVolumeClaim
              name: ollama
            patch: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: ollama
                labels:
                  recurring-job.longhorn.io/source: enabled
                  recurring-job.longhorn.io/filesystem-trim: enabled
