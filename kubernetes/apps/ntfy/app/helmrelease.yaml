apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: ntfy
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    force: true
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    controllers:
      ntfy:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.37.2
            args:
              - serve
            env:
              NTFY_BASE_URL: https://ntfy.${cluster_domain}
              NTFY_BEHIND_PROXY: "true"
              NTFY_AUTH_FILE: /var/lib/ntfy/user.db
              NTFY_AUTH_DEFAULT_ACCESS: deny-all
              NTFY_AUTH_ACCESS: alertmanager:alerts:wo,grafana:alerts:wo,flux:flux:wo,phone:alerts:ro,phone:flux:ro
              NTFY_AUTH_USERS:
                valueFrom:
                  secretKeyRef:
                    name: ntfy
                    key: NTFY_AUTH_USERS
              NTFY_AUTH_TOKENS:
                valueFrom:
                  secretKeyRef:
                    name: ntfy
                    key: NTFY_AUTH_TOKENS
              NTFY_CACHE_FILE: ""
              NTFY_ENABLE_LOGIN: "true"
              NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 80
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 80
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
    service:
      app:
        controller: ntfy
        ports:
          http:
            port: 80
    persistence:
      auth:
        type: emptyDir
        globalMounts:
          - path: /var/lib/ntfy
