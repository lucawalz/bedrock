apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
components:
  - ../../../components/topology-spread
resources:
  - helmrelease.yaml
configMapGenerator:
  - name: paperless-gpt-prompts
    files:
      - prompts/title_prompt.tmpl
      - prompts/correspondent_prompt.tmpl
  - name: paperless-gpt-settings
    files:
      - settings.template.json
      - render_settings.py
generatorOptions:
  disableNameSuffixHash: true
