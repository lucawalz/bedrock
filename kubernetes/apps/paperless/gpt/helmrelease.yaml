apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-gpt
  namespace: paperless
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    force: true
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    controllers:
      paperless-gpt:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          render-config:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            command:
              - python3
              - /src/settings/render_settings.py
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              PAPERLESS_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paperless-gpt
                    key: PAPERLESS_API_TOKEN
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/icereed/paperless-gpt
              tag: v0.31.0@sha256:d668941a829552cc0eddbc7c22506b3480dfbf61bd0d6eae881ad9fcfe2de70c
            env:
              PAPERLESS_BASE_URL: http://paperless-ngx:8000
              PAPERLESS_PUBLIC_URL: https://paperless.${cluster_domain}
              LLM_PROVIDER: openai
              LLM_MODEL: paperless-haiku
              OCR_PROVIDER: llm
              VISION_LLM_PROVIDER: openai
              VISION_LLM_MODEL: paperless-haiku
              OPENAI_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
              VISION_LLM_MAX_TOKENS: "8192"
              CREATE_NEW_TAGS: "false"
              AUTO_TAG: paperless-gpt-auto
              TOKEN_LIMIT: "8000"
              PAPERLESS_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paperless-gpt
                    key: PAPERLESS_API_TOKEN
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-gpt
                    key: OPENAI_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paperless-gpt
        ports:
          http:
            port: 8080
    persistence:
      data:
        existingClaim: paperless-gpt
        globalMounts:
          - path: /app/db
            subPath: db
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      prompts:
        type: emptyDir
        globalMounts:
          - path: /app/prompts
      prompts-src:
        type: configMap
        name: paperless-gpt-prompts
        advancedMounts:
          paperless-gpt:
            render-config:
              - path: /src/prompts
                readOnly: true
      settings-src:
        type: configMap
        name: paperless-gpt-settings
        advancedMounts:
          paperless-gpt:
            render-config:
              - path: /src/settings
                readOnly: true
      taxonomy-src:
        type: configMap
        name: paperless-taxonomy
        advancedMounts:
          paperless-gpt:
            render-config:
              - path: /src/taxonomy
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
