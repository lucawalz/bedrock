apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-taxonomy-config
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-taxonomy-config
  namespace: paperless
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-taxonomy-config
  namespace: paperless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperless-taxonomy-config
subjects:
  - kind: ServiceAccount
    name: paperless-taxonomy-config
    namespace: flux-system
