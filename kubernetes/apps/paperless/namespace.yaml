apiVersion: v1
kind: Namespace
metadata:
  name: paperless
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    bedrock.io/postgres-client: "true"
    bedrock.io/traefik-routable: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: paperless
automountServiceAccountToken: false
