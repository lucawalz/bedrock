apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-gpt-access
  namespace: paperless
spec:
  backoffLimit: 10
  # deleting the finished Job lets Flux recreate it on a later reconcile, which repairs drift such as a restored database
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        bedrock.io/wait-for: postgres-rw.postgres.svc.cluster.local:5432 paperless-redis:6379
      labels:
        app.kubernetes.io/name: paperless-gpt-access
        bedrock.io/postgres-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: access
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
          command:
            - python3
            - manage.py
            - shell
            - --command
            - |
              import os
              from django.contrib.auth.models import Group, Permission, User
              from rest_framework.authtoken.models import Token
              from documents.models import UiSettings, Workflow, WorkflowAction, WorkflowTrigger

              NAME = "paperless-gpt"
              CODENAMES = [
                  "view_document", "change_document",
                  "view_tag", "add_tag",
                  "view_correspondent", "add_correspondent",
                  "view_documenttype",
                  "view_customfield",
              ]

              group, _ = Group.objects.get_or_create(name=NAME)
              permissions = Permission.objects.filter(content_type__app_label="documents", codename__in=CODENAMES)
              if permissions.count() != len(CODENAMES):
                  raise SystemExit("a paperless-gpt permission codename is missing")
              group.permissions.set(permissions)

              user, _ = User.objects.get_or_create(username=NAME)
              user.is_superuser = False
              user.is_staff = False
              user.set_unusable_password()
              user.save()
              user.groups.set([group])
              user.user_permissions.clear()

              key = os.environ["PAPERLESS_API_TOKEN"]
              token = Token.objects.filter(user=user).first()
              if token is not None and token.key != key:
                  token.delete()
                  token = None
              if token is None:
                  Token.objects.create(user=user, key=key)

              workflow, _ = Workflow.objects.get_or_create(name=NAME)
              trigger = workflow.triggers.first() or WorkflowTrigger()
              trigger.type = WorkflowTrigger.WorkflowTriggerType.DOCUMENT_ADDED
              trigger.save()
              action = workflow.actions.first() or WorkflowAction()
              action.type = WorkflowAction.WorkflowActionType.ASSIGNMENT
              action.save()
              action.assign_view_groups.add(group)
              action.assign_change_groups.add(group)
              workflow.triggers.set([trigger])
              workflow.actions.set([action])
              workflow.enabled = True
              workflow.save()

              owner = User.objects.get(username=os.environ["PAPERLESS_ADMIN_USER"])
              ui_settings, _ = UiSettings.objects.get_or_create(user=owner, defaults={"settings": {}})
              stored = ui_settings.settings or {}
              defaults = stored.setdefault("permissions", {})
              # the frontend reads general-settings:permissions:default-edit-groups, stored as default_edit_groups
              for setting in ("default_view_groups", "default_edit_groups"):
                  ids = defaults.get(setting) or []
                  if group.pk not in ids:
                      defaults[setting] = [*ids, group.pk]
              ui_settings.settings = stored
              ui_settings.save()
          env:
            - name: PAPERLESS_DATA_DIR
              value: /tmp/data
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: PAPERLESS_DBPASS
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-gpt
                  key: PAPERLESS_API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
