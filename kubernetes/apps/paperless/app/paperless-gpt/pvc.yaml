apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-gpt
  namespace: paperless
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/snapshot: enabled
    recurring-job.longhorn.io/snapshot-prune: enabled
    recurring-job.longhorn.io/filesystem-trim: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
