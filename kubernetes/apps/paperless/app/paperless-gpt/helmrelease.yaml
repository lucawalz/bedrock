apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-gpt
  namespace: paperless
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    force: true
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  values:
    controllers:
      paperless-gpt:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/icereed/paperless-gpt
              tag: v0.31.0@sha256:d668941a829552cc0eddbc7c22506b3480dfbf61bd0d6eae881ad9fcfe2de70c
            env:
              PAPERLESS_BASE_URL: http://paperless-ngx:8000
              PAPERLESS_PUBLIC_URL: https://paperless.${cluster_domain}
              LLM_PROVIDER: anthropic
              LLM_MODEL: claude-haiku-4-5
              OCR_PROVIDER: llm
              VISION_LLM_PROVIDER: anthropic
              VISION_LLM_MODEL: claude-haiku-4-5
              VISION_LLM_MAX_TOKENS: "8192"
              PAPERLESS_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: paperless-gpt
                    key: PAPERLESS_API_TOKEN
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-gpt
                    key: ANTHROPIC_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paperless-gpt
        ports:
          http:
            port: 8080
    persistence:
      data:
        existingClaim: paperless-gpt
        globalMounts:
          - path: /app/config
            subPath: config
          - path: /app/db
            subPath: db
          - path: /app/prompts
            subPath: prompts
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
