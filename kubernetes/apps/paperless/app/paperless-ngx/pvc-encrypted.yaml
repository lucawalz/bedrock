---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-data-encrypted
  namespace: paperless
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/snapshot: enabled
    recurring-job.longhorn.io/snapshot-prune: enabled
    recurring-job.longhorn.io/filesystem-trim: enabled
    recurring-job.longhorn.io/offsite-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
---
