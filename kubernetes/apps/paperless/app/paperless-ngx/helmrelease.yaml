apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: paperless-ngx
      version: "0.24.1"
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: 3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
    env:
      TZ: Europe/Berlin
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
      PAPERLESS_URL: https://paperless.${cluster_domain}
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres-rw.postgres.svc.cluster.local
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_FILENAME_FORMAT: "{{`{{ created_year }}/{{ document_type }}/{{ correspondent }}/{{ created_year }}-{{ created_month }}-{{ created_day }} {{ title }}`}}"
      PAPERLESS_TASK_WORKERS: "2"
      PAPERLESS_THREADS_PER_WORKER: "1"
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_AI_ENABLED: "false"
      PAPERLESS_DBPASS:
        valueFrom:
          secretKeyRef:
            name: paperless
            key: PAPERLESS_DBPASS
      PAPERLESS_SECRET_KEY:
        valueFrom:
          secretKeyRef:
            name: paperless
            key: PAPERLESS_SECRET_KEY
      PAPERLESS_ADMIN_USER:
        valueFrom:
          secretKeyRef:
            name: paperless
            key: PAPERLESS_ADMIN_USER
      PAPERLESS_ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: paperless
            key: PAPERLESS_ADMIN_PASSWORD
    service:
      main:
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: false
    persistence:
      data:
        enabled: true
        existingClaim: paperless-ngx-data-encrypted
      media:
        enabled: true
        existingClaim: paperless-ngx-media-encrypted
      export:
        enabled: true
        existingClaim: paperless-ngx-export-encrypted
      consume:
        enabled: true
        existingClaim: paperless-ngx-consume-encrypted
    podLabels:
      bedrock.io/postgres-client: "true"
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: "2000m"
        memory: 2Gi
    redis:
      enabled: false
    postgresql:
      enabled: false
    mariadb:
      enabled: false
