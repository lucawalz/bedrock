apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Paperless
    gethomepage.dev/group: Documents
    gethomepage.dev/icon: paperless-ngx.png
    gethomepage.dev/href: https://paperless.${cluster_domain}
    gethomepage.dev/pod-selector: app.kubernetes.io/name=paperless-ngx
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`paperless.${cluster_domain}`)
      kind: Rule
      services:
        - name: paperless-ngx
          port: 8000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless-gpt
  namespace: paperless
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Paperless-GPT
    gethomepage.dev/group: Documents
    gethomepage.dev/icon: paperless-gpt.png
    gethomepage.dev/href: https://paperless-gpt.${cluster_domain}
    gethomepage.dev/pod-selector: app.kubernetes.io/name=paperless-gpt
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`paperless-gpt.${cluster_domain}`)
      kind: Rule
      middlewares:
        - name: forward-auth
      services:
        - name: paperless-gpt
          port: 8080
  tls: {}
