apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-tika
  namespace: paperless
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    force: true
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    controllers:
      tika:
        containers:
          app:
            image:
              repository: docker.io/apache/tika
              tag: "3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1000m"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: tika
        ports:
          http:
            port: 9998
