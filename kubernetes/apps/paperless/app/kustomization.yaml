apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
components:
  - ../../../components/network-policies/base
  - ../../../components/network-policies/intra-namespace
  - ../../../components/network-policies/internet-egress
  - ../../../components/forward-auth
resources:
  - paperless-ngx
  - paperless-gpt
  - redis
  - gotenberg
  - tika
  - ingress.yaml
  - networkpolicies.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: allow-internet-egress
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: paperless-gpt
      - op: test
        path: /spec/egress/0/ports/0/port
        value: 80
      - op: remove
        path: /spec/egress/0/ports/0
