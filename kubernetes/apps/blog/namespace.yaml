apiVersion: v1
kind: Namespace
metadata:
  name: blog
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    bedrock.io/traefik-routable: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: blog
automountServiceAccountToken: false
