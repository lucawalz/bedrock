apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  values:
    controllers:
      home-assistant:
        strategy: Recreate
        initContainers:
          seed-config:
            image:
              repository: busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - sh
              - -c
              - |
                test -f /config/configuration.yaml || cp /config-seed/configuration.yaml /config-seed/automations.yaml /config-seed/scripts.yaml /config-seed/scenes.yaml /config/
                # the proxy settings live in the storage entry; a yaml http block is ignored and is removed upstream in 2027.2.0
                test -f /config/.storage/http || { mkdir -p /config/.storage && cp /config-seed/http /config/.storage/http; }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.1"
            command:
              - python3
              - -m
              - homeassistant
              - --config
              - /config
            env:
              PYTHONMALLOC: mimalloc
              TZ: Europe/Berlin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 60
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 30
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
    persistence:
      config-seed:
        type: configMap
        name: home-assistant-config-seed
        globalMounts:
          - path: /config-seed
            readOnly: true
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
