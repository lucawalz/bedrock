      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: cloudflare-tunnel
    - kind: HelmRelease
      name: '*'
      namespace: cnpg-system
    - kind: HelmRelease
      name: '*'
      namespace: flagger
    - kind: HelmRelease
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: kube-system
    - kind: HelmRelease
      name: '*'
      namespace: kyverno
    - kind: HelmRelease
      name: '*'
      namespace: metallb-system
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRelease
      name: '*'
      namespace: oauth2-proxy
    - kind: HelmRelease
      name: '*'
      namespace: pocket-id
    - kind: HelmRelease
      name: '*'
      namespace: reloader
    - kind: HelmRelease
      name: '*'
      namespace: traefik
    - kind: HelmRelease
      name: '*'
