apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-privilege-escalation
  annotations:
    policies.kyverno.io/title: Default allowPrivilegeEscalation To False
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # mutating the workload template instead of the pod would show as drift on every helm reconcile
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: containers-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
    - name: init-containers-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[] || `[]` | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
