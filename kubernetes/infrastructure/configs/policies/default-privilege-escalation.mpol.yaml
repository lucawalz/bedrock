apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-privilege-escalation
  annotations:
    policies.kyverno.io/title: Default allowPrivilegeEscalation To False
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
    mutatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                securityContext: Object.spec.containers.securityContext{
                  allowPrivilegeEscalation: c.?securityContext.?allowPrivilegeEscalation.orValue(false)
                }
              })
            }
          }
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          has(object.spec.initContainers) ?
          Object{
            spec: Object.spec{
              initContainers: object.spec.initContainers.map(c, Object.spec.initContainers{
                name: c.name,
                securityContext: Object.spec.initContainers.securityContext{
                  allowPrivilegeEscalation: c.?securityContext.?allowPrivilegeEscalation.orValue(false)
                }
              })
            }
          } : Object{}
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          has(object.spec.ephemeralContainers) ?
          Object{
            spec: Object.spec{
              ephemeralContainers: object.spec.ephemeralContainers.map(c, Object.spec.ephemeralContainers{
                name: c.name,
                securityContext: Object.spec.ephemeralContainers.securityContext{
                  allowPrivilegeEscalation: c.?securityContext.?allowPrivilegeEscalation.orValue(false)
                }
              })
            }
          } : Object{}
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          request.operation == "CREATE" && !object.spec.?securityContext.?seccompProfile.hasValue() ?
          Object{
            spec: Object.spec{
              securityContext: Object.spec.securityContext{
                seccompProfile: Object.spec.securityContext.seccompProfile{
                  type: "RuntimeDefault"
                }
              }
            }
          } : Object{}
