---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: paperless-ngx
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-drop-all-capabilities
      ruleNames:
        - "*"
    - policyName: require-run-as-non-root
      ruleNames:
        - "*"
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
          namespaces:
            - paperless
          selector:
            matchLabels:
              app.kubernetes.io/name: paperless-ngx
              app.kubernetes.io/instance: paperless-ngx
  conditions:
    all:
      - key: "{{ (request.object.spec.template.spec || request.object.spec).[containers, initContainers, ephemeralContainers][][].image }}"
        operator: AllIn
        value:
          - "ghcr.io/paperless-ngx/paperless-ngx:*"
---
