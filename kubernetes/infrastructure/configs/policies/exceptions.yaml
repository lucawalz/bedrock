---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: authentik-restricted
  namespace: authentik
spec:
  exceptions:
    - policyName: require-drop-all-capabilities
      ruleNames:
        - "*"
    - policyName: require-run-as-non-root
      ruleNames:
        - "*"
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
          namespaces:
            - authentik
          names:
            - authentik-server
            - authentik-server-*
            - authentik-worker
            - authentik-worker-*
