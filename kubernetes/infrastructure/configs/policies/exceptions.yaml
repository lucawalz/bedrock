apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: paperless-ngx
  namespace: kyverno
spec:
  policyRefs:
    - name: require-drop-all-capabilities
      kind: ValidatingPolicy
    - name: require-run-as-non-root
      kind: ValidatingPolicy
  matchConditions:
    - name: kind
      expression: object.kind in ['Pod', 'Deployment']
    - name: namespace
      expression: object.metadata.namespace == 'paperless'
    - name: labels
      expression: >-
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'paperless-ngx' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'paperless-ngx'
    - name: images
      expression: >-
        [has(object.spec.template) ? object.spec.template.spec : object.spec].all(s,
          (s.containers + s.?initContainers.orValue([]) + s.?ephemeralContainers.orValue([])).all(c,
            c.image.startsWith('ghcr.io/paperless-ngx/paperless-ngx:')))
---
