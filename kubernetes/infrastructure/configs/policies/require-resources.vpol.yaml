apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
        - replicasets
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?requests[?'cpu'].hasValue() &&
          c.?resources.?requests[?'memory'].hasValue() &&
          c.?resources.?limits[?'memory'].hasValue())
      message: "CPU and memory requests and a memory limit are required for every container."
