apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-node-finalizer
  namespace: longhorn-system
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: longhorn-node-finalizer
        spec:
          serviceAccountName: longhorn-node-finalizer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: longhorn-node-finalizer
              image: alpine/k8s:1.36.2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  if lhnodes="$(kubectl get nodes.longhorn.io -n longhorn-system \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.allowScheduling}{"\n"}{end}')"; then
                    printf '%s\n' "$lhnodes" | while read -r lhnode allow; do
                      [ -n "$lhnode" ] || continue
                      kubectl get node "$lhnode" >/dev/null 2>&1 && continue
                      if [ "$allow" = "true" ]; then
                        echo "disabling scheduling on orphaned longhorn node $lhnode"
                        kubectl patch nodes.longhorn.io "$lhnode" -n longhorn-system \
                          --type=merge -p '{"spec":{"allowScheduling":false}}'
                      fi
                    done
                  else
                    echo "longhorn nodes unavailable; skipping longhorn finalize" >&2
                  fi
