apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 3
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/snapshot: enabled
      recurring-job.longhorn.io/snapshot-prune: enabled
      recurring-job.longhorn.io/filesystem-trim: enabled
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  enableSuperuserAccess: false
  priorityClassName: system-cluster-critical
  primaryUpdateMethod: switchover
  postgresql:
    parameters:
      max_slot_wal_keep_size: 2GB
    pg_hba:
      - hostssl sameuser all all scram-sha-256
      - host all all all reject
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    size: 8Gi
    storageClass: longhorn-encrypted-local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  bootstrap:
    initdb:
      database: app
      owner: app
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
