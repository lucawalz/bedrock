apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/network-policies/base
  - ../../../../components/network-policies/internet-egress
resources:
  - helmrelease.yaml
  - networkpolicies.yaml
  - schedule.yaml
  - volumepolicy.yaml
  - volumesnapshotclass.yaml
# the velero HelmRelease lives in flux-system, so this kustomization cannot carry a namespace transformer
patches:
  - target:
      kind: NetworkPolicy
      name: default-deny
    patch: |-
      - op: add
        path: /metadata/namespace
        value: velero
  - target:
      kind: NetworkPolicy
      name: allow-dns
    patch: |-
      - op: add
        path: /metadata/namespace
        value: velero
  - target:
      kind: NetworkPolicy
      name: allow-internet-egress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: velero
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: velero
