apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    global:
      priorityClassName: system-cluster-critical
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - longhorn-system
                - cert-manager
                - metallb-system
                - monitoring
                - cnpg-system
      resourceFiltersIncludeNamespaces:
        - kube-system
        - kube-node-lease
        - kube-public
        - flux-system
        - kyverno
        - cnpg-system
        - cert-manager
        - longhorn-system
        - metallb-system
        - monitoring
    admissionController:
      replicas: 2
      podDisruptionBudget:
        unhealthyPodEvictionPolicy: AlwaysAllow
      container:
        extraArgs:
          webhookTimeout: 5
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno
          tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution: []
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      initContainer:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyvernopre
          tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/background-controller
        tag: v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/cleanup-controller
        tag: v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          # Report reconciliation is bursty: median 3m, but the p99 minute sits at the limit and is clipped.
          cpu: 1000m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/reports-controller
        tag: v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      backgroundScan:
        backgroundScanInterval: 15m
        skipResourceFilters: false
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
    test:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c
    webhooksCleanup:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c
    crds:
      migration:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno-cli
          tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
