apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    global:
      priorityClassName: system-cluster-critical
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - longhorn-system
                - cert-manager
                - metallb-system
                - monitoring
                - cnpg-system
      resourceFiltersIncludeNamespaces:
        - kube-system
        - kube-node-lease
        - kube-public
        - flux-system
        - kyverno
        - cnpg-system
        - cert-manager
        - longhorn-system
        - metallb-system
        - monitoring
    admissionController:
      replicas: 2
      podDisruptionBudget:
        unhealthyPodEvictionPolicy: AlwaysAllow
      container:
        extraArgs:
          webhookTimeout: 5
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution: []
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          # Report reconciliation is bursty: median 3m, but the p99 minute sits at the limit and is clipped.
          cpu: 1000m
          memory: 256Mi
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      backgroundScan:
        backgroundScanInterval: 15m
        skipResourceFilters: false
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
