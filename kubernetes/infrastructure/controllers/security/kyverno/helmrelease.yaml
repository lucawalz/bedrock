apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    global:
      priorityClassName: system-cluster-critical
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - longhorn-system
                - cert-manager
                - metallb-system
                - monitoring
                - cnpg-system
      resourceFiltersIncludeNamespaces:
        - kube-system
        - kube-node-lease
        - kube-public
        - flux-system
        - kyverno
        - cnpg-system
        - cert-manager
        - longhorn-system
        - metallb-system
        - monitoring
    admissionController:
      replicas: 2
      podDisruptionBudget:
        unhealthyPodEvictionPolicy: AlwaysAllow
      container:
        extraArgs:
          webhookTimeout: 5
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno
          tag: v1.18.2@sha256:0a540e2ddf74d0d2d3d45f9ef248d7dbc96576accdbcc6a2dd7eaff9fea56504
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution: []
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      initContainer:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyvernopre
          tag: v1.18.2@sha256:cd8cb4a31d25b3992734fb8f24a90ef691c90ce49338c89bea96792160eacb98
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/background-controller
        tag: v1.18.2@sha256:d62566ce41bd0d4a32bf2cf44b9ebfc02c36374f821f83070890287f62f68671
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/cleanup-controller
        tag: v1.18.2@sha256:b0395d29ae332276e6910eb40418be9bc127c068d659f90aa1bcddd6be99ccb4
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          # Report reconciliation is bursty: median 3m, but the p99 minute sits at the limit and is clipped.
          cpu: 1000m
          memory: 256Mi
      image:
        registry: reg.kyverno.io
        repository: kyverno/reports-controller
        tag: v1.18.2@sha256:f09cf305170014e191b94e1c54f5be73163d8824eefad49349675c4efe43159a
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      backgroundScan:
        backgroundScanInterval: 15m
        skipResourceFilters: false
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
