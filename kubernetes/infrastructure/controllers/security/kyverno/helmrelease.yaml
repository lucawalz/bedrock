apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    global:
      priorityClassName: system-cluster-critical
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - longhorn-system
                - cert-manager
                - metallb-system
                - monitoring
                - velero
                - cnpg-system
      resourceFiltersIncludeNamespaces:
        - kube-system
        - kube-node-lease
        - kube-public
        - flux-system
        - kyverno
        - cnpg-system
        - cert-manager
        - longhorn-system
        - metallb-system
        - monitoring
        - velero
        - cattle-capi-system
        - cattle-fleet-clusters-system
        - cattle-fleet-local-system
        - cattle-fleet-system
        - cattle-impersonation-system
        - cattle-system
        - cattle-turtles-system
        - cattle-ui-plugin-system
        - fleet-*
        - cluster-fleet-*
        - local
    admissionController:
      replicas: 2
      podDisruptionBudget:
        unhealthyPodEvictionPolicy: AlwaysAllow
      container:
        extraArgs:
          webhookTimeout: 5
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution: []
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    features:
      policyExceptions:
        enabled: true
        namespace: "*"
      policyReports:
        enabled: true
      admissionReports:
        enabled: true
      backgroundScan:
        backgroundScanInterval: 15m
        skipResourceFilters: false
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
