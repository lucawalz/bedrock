apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: reloader
      version: "2.2.21"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    reloader:
      watchGlobally: false
      namespaces:
        - cloudflare-tunnel
        - homepage
        - litellm
        - llm
        - ntfy
        - oauth2-proxy
        - paperless
        - pocket-id
        - vaultwarden
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    image:
      repository: ghcr.io/stakater/reloader
      tag: v1.4.25@sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
