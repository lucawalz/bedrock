apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: reloader
      version: "2.2.19"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    reloader:
      watchGlobally: false
      namespaces:
        - cloudflare-tunnel
        - homepage
        - litellm
        - oauth2-proxy
        - paperless
        - pocket-id
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    image:
      repository: ghcr.io/stakater/reloader
      tag: v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410
