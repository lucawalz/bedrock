apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: policy-reporter
      version: "3.11.2"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
    plugin:
      kyverno:
        enabled: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        image:
          registry: ghcr.io
          repository: kyverno/policy-reporter/kyverno-plugin
          tag: 0.7.3@sha256:777d2318ff194c666ce1cb1f881c0556d6dc2c1cda6b3990d5c1a42bdb64ae2e
    ui:
      enabled: false
    monitoring:
      enabled: true
      serviceMonitor:
        labels:
          release: kube-prometheus-stack
      grafana:
        namespace: monitoring
        dashboards:
          enabled: true
          label: grafana_dashboard
          value: "1"
    image:
      registry: ghcr.io
      repository: kyverno/policy-reporter
      tag: 3.11.2@sha256:2b33409d34be3195f16d9ed2c89f8b58001aeec986b254ba6bb45323d6d1e884
