apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . 10.20.0.1 1.1.1.1 9.9.9.9 {
          policy sequential
        }
    }
    import /etc/coredns/custom/*.server
  NodeHosts: |
    10.20.0.10 cp-1
    10.20.0.11 worker-1
    10.20.0.12 worker-2
