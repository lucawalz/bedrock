apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher
  namespace: cattle-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Rancher
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: rancher.png
    gethomepage.dev/href: https://rancher.syslabs.dev
    gethomepage.dev/podSelector: app=rancher
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - websecure
  routes:
    # agent registration and health probes cannot complete a forward-auth flow
    - match: Host(`rancher.syslabs.dev`) && (PathPrefix(`/ping`) || PathPrefix(`/healthz`) || PathPrefix(`/v3/connect`) || PathPrefix(`/v3/import`))
      kind: Rule
      priority: 20
      middlewares:
        - name: rancher-forwarded-proto
      services:
        - name: rancher
          port: 80
    - match: Host(`rancher.syslabs.dev`)
      kind: Rule
      priority: 10
      middlewares:
        - name: rancher-forwarded-proto
        - name: authentik-forward-auth
      services:
        - name: rancher
          port: 80
  tls: {}
