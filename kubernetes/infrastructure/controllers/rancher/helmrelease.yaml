apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: cattle-system
spec:
  suspend: false
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: rancher
      version: "2.15.1"
      sourceRef:
        kind: HelmRepository
        name: rancher
        namespace: flux-system
  values:
    ingress:
      enabled: false

    tls: external
    agentTLSMode: system-store

    hostname: rancher.syslabs.dev

    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 300m
        memory: 1536Mi

    auditLog:
      destination: sidecar
      maxAge: 30
      maxBackup: 10
      maxSize: 100

    replicas: 1

    bootstrapPassword: ""
    useExistingSecret: rancher-admin-secret
    existingSecretKey: password

  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
