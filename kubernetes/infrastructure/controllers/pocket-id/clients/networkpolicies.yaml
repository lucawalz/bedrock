apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pocket-id-clients-egress
  namespace: pocket-id
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id-clients
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pocket-id
      ports:
        - protocol: TCP
          port: 1411
