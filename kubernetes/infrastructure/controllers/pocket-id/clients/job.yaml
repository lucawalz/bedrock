apiVersion: batch/v1
kind: Job
metadata:
  name: pocket-id-clients
  namespace: pocket-id
spec:
  backoffLimit: 6
  # deleting the finished Job lets Flux recreate it on a later reconcile, which repairs drift such as a restored database
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        bedrock.io/wait-for: pocket-id.pocket-id.svc.cluster.local:1411
      labels:
        app.kubernetes.io/name: pocket-id-clients
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: python:3.15.1-alpine3.24@sha256:54448f67d7c31c39e5cdd3ea2d6382395ce142806c284425f8e897d78a0465b3
          command:
            - python3
            - -I
            - -B
            - /config/sync.py
          env:
            - name: POCKET_ID_URL
              value: http://pocket-id.pocket-id.svc.cluster.local:1411
            - name: STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id
                  key: STATIC_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pocket-id-clients
        - name: secrets
          secret:
            secretName: pocket-id-clients
