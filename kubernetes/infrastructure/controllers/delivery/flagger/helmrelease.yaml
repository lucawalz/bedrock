apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: flagger
      version: "1.44.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    meshProvider: traefik
    rbac:
      create: false
    metricsServer: http://kube-prometheus-stack-prometheus.monitoring:9090
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      enabled: true
      context:
        runAsNonRoot: true
        runAsUser: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    podMonitor:
      enabled: false
    prometheus:
      install: false
    image:
      repository: ghcr.io/fluxcd/flagger
      tag: 1.44.0@sha256:d7898869ab003087a33d216219d7d04f3cdf6547d80a6dcdfd37aeb61072a632
