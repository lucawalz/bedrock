apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "31.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      annotations:
        helm.sh/resource-policy: keep
