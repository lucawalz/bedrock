apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
  values:
    image:
      # renovate: datasource=docker depName=docker.io/grafana/alloy
      tag: v1.21.3
      digest: sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    controller:
      type: daemonset
    rbac:
      create: true
      rules:
        - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
          resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
          verbs: ["get", "list", "watch"]
    serviceAccount:
      create: true
    alloy:
      clustering:
        enabled: false
      mounts:
        varlog: true
        dockercontainers: false
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
      configMap:
        create: true
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
          }
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }
          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }
          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }
          loki.process "pod_logs" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }
          local.file_match "kubernetes_audit" {
            path_targets = [{"__path__" = "/var/log/kubernetes/audit.log", "job" = "kubernetes-audit"}]
          }
          loki.source.file "kubernetes_audit" {
            targets    = local.file_match.kubernetes_audit.targets
            forward_to = [loki.process.kubernetes_audit.receiver]
          }
          loki.process "kubernetes_audit" {
            stage.json {
              expressions = { ts = "stageTimestamp" }
            }
            stage.timestamp {
              source = "ts"
              format = "RFC3339Nano"
            }
            stage.limit {
              rate  = 100
              burst = 1000
              drop  = false
            }
            forward_to = [loki.write.default.receiver]
          }
          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
          otelcol.receiver.otlp "default" {
            grpc { endpoint = "0.0.0.0:4317" }
            http { endpoint = "0.0.0.0:4318" }
            output { traces = [otelcol.processor.batch.default.input] }
          }
          otelcol.processor.batch "default" {
            output { traces = [otelcol.exporter.otlphttp.tempo.input] }
          }
          otelcol.exporter.otlphttp "tempo" {
            client { endpoint = "http://tempo.monitoring.svc.cluster.local:4318" }
          }
    configReloader:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
