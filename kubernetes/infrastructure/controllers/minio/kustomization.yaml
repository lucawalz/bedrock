apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../../components/authentik-middleware
resources:
  - helmrelease.yaml
  - ingressroute.yaml
  - networkpolicy.yaml
patches:
# the minio HelmRelease lives in flux-system, so this kustomization cannot carry a namespace transformer
- patch: |-
    - op: add
      path: /metadata/namespace
      value: minio
  target:
    kind: Middleware
    name: authentik-forward-auth
