apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gap-filler-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerCertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days"
            description: "The cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}."
        - alert: CertManagerCertExpired
          expr: certmanager_certificate_expiration_timestamp_seconds - time() <= 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has expired"
            description: "The cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} expired {{ $value | humanizeDuration }} ago."
    - name: flux.rules
      rules:
        - alert: FluxReconciliationFailure
          expr: max(flux_resource_info{ready="False", suspended="False"}) by (kind, name, exported_namespace) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} failed to reconcile"
            description: "The Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been ready for more than 15 minutes."
        - alert: FluxMetricsAbsent
          expr: absent(flux_resource_info)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux resource metrics have disappeared"
            description: "Prometheus has held no flux_resource_info series for more than 15 minutes, so FluxReconciliationFailure cannot fire and a stalled delivery pipeline would stay invisible."
        - alert: HelmReleaseStalled
          expr: max(flux_resource_info{kind="HelmRelease", ready="False", suspended="False"}) by (name, exported_namespace, reason) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} is stalled"
            description: "The HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} has reported Ready=False for over 5 minutes, most recently with reason {{ $labels.reason }}. Some HelmReleases in this cluster set remediateLastFailure to false so a failed upgrade stays deployed instead of rolling back, and once retries are exhausted the release stops changing on its own. FluxReconciliationFailure already reports the same condition for every Flux kind at warning severity behind a twelve hour digest; this alert covers HelmRelease specifically at critical severity so a stalled release reaches a human promptly instead of waiting in that digest."
        - alert: HelmReleaseDriftDetected
          expr: kube_helmrelease_status_condition{type="Drifted"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HelmRelease {{ $labels.namespace }}/{{ $labels.name }} has drifted from its declared state"
            description: "The HelmRelease {{ $labels.namespace }}/{{ $labels.name }} has reported its Drifted condition True for over 15 minutes, meaning the live cluster state no longer matches what Helm rendered. driftDetection is set to mode warn on every HelmRelease in this cluster, which records the drift and emits a Kubernetes event but corrects nothing, so this alert is the only thing that turns that event into a notification."
    - name: cnpg.rules
      rules:
        - alert: CNPGStandbyNotStreaming
          expr: cnpg_pg_replication_is_wal_receiver_up{namespace="postgres"} == 0 and on (namespace, pod) cnpg_pg_replication_in_recovery{namespace="postgres"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG standby {{ $labels.namespace }}/{{ $labels.pod }} has stopped streaming"
            description: "The standby {{ $labels.namespace }}/{{ $labels.pod }} has no WAL receiver, so it is no longer replicating from the primary. Nothing else reports this: the pod stays Running and Ready because the instance manager is healthy, readyInstances still counts it, and quorum synchronous replication is satisfied by the remaining standby, so writes never degrade. A standby in this state silently stops being a copy of the data. The match on cnpg_pg_replication_in_recovery excludes the primary, which reports no WAL receiver by definition."
        - alert: CNPGStreamingReplicasBelowExpected
          expr: cnpg_pg_replication_streaming_replicas{namespace="postgres"} < 2 and on (namespace, pod) cnpg_pg_replication_in_recovery{namespace="postgres"} == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG primary {{ $labels.namespace }}/{{ $labels.pod }} sees only {{ $value }} streaming standbys"
            description: "The primary {{ $labels.namespace }}/{{ $labels.pod }} has been streaming to fewer than the two standbys a three instance cluster expects for an hour, so the cluster is running on reduced redundancy. This is measured from the primary deliberately, because CNPGStandbyNotStreaming needs the broken standby to keep exporting metrics and cannot fire when its exporter is gone entirely."
        - alert: CNPGReplicationLagHigh
          expr: cnpg_pg_stat_replication_replay_lag_seconds{namespace="postgres"} > 30
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG standby {{ $labels.application_name }} is lagging behind {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "The primary {{ $labels.namespace }}/{{ $labels.pod }} has reported standby {{ $labels.application_name }} more than 30 seconds behind on WAL replay for 15 minutes. A lagging standby is still streaming and does not trip CNPGStandbyNotStreaming, but it holds stale data and would lose recent transactions if promoted while behind."
        - alert: CNPGFailoverDetected
          expr: resets(cnpg_pg_replication_in_recovery{namespace="postgres"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG instance {{ $labels.namespace }}/{{ $labels.pod }} was promoted"
            description: "Instance {{ $labels.namespace }}/{{ $labels.pod }} left recovery mode in the last 15 minutes, meaning it was promoted from standby to primary. This fires for both an automatic failover and a manual switchover, because the replication state it is built on cannot tell the two apart; either way the cluster's primary changed and is worth a look."
    - name: longhorn.rules
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Longhorn reports volume {{ $labels.volume }} as degraded for over 30 minutes, so it is running with fewer healthy replicas than configured."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is faulted"
            description: "Longhorn reports volume {{ $labels.volume }} as faulted, meaning no replica is usable and the volume can serve neither reads nor writes. LonghornVolumeDegraded cannot stand in for this on a single-replica volume, which has no degraded state to pass through and moves straight from healthy to faulted."
        - alert: LonghornVolumeUnschedulable
          expr: kube_longhornvolume_status_condition{type="Scheduled"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn cannot place every replica of {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
            description: "Longhorn has reported the Scheduled condition false on the volume backing {{ $labels.pvc_namespace }}/{{ $labels.pvc }} for over 30 minutes, meaning no disk has enough scheduling budget for at least one replica the volume wants. The volume keeps serving from the replicas it already has, so nothing fails visibly; what it loses is the redundancy or the data locality it was configured for. Longhorn exports no metric for this condition, so this reads it from the volume's own status through kube-state-metrics."
        - alert: LonghornVolumeOverDeclared
          expr: |
            (kube_longhornvolume_declared_bytes - kube_longhornvolume_actual_bytes) * on (name) group_left kube_longhornvolume_replicas > 20e9
              and kube_longhornvolume_declared_bytes / clamp_min(kube_longhornvolume_actual_bytes, 1) > 10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} declares far more than it stores"
            description: "The volume backing {{ $labels.pvc_namespace }}/{{ $labels.pvc }} declares more than ten times what it holds, and the gap costs over 20 GB of scheduling budget once multiplied by its replica count. Longhorn charges a replica its declared size the moment it is placed, whatever the volume contains, so an over-declaration is spent budget rather than spare room. Longhorn expands but never shrinks, so correcting one means recreating the claim, which is worth doing only for a volume whose declaration is wrong rather than merely generous."
        - record: longhorn:node_replica_scheduling:budget_used_percent
          expr: max by (node) (longhorn_node_storage_scheduled_bytes / clamp_min((longhorn_node_storage_capacity_bytes - longhorn_node_storage_reservation_bytes) * 200 / 100, 1) * 100)
        - alert: LonghornSchedulingHeadroomLow
          expr: longhorn:node_replica_scheduling:budget_used_percent > 90
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node {{ $labels.node }} has little replica scheduling headroom left"
            description: "Longhorn has already promised {{ $value | printf \"%.0f\" }} percent of the schedulable budget on node {{ $labels.node }}, where the budget is disk capacity minus the per-disk reservation Longhorn withholds from scheduling, multiplied by the 200 percent over-provisioning factor Longhorn applies to declared replica sizes. This counts space promised to volumes rather than bytes written, so the disk is not filling up, and a separate minimum-available check measured on real bytes stops scheduling if it ever does. What it bounds is provisioning: with hard replica anti-affinity and allowVolumeCreationWithDegradedAvailability disabled, Longhorn refuses to schedule any new replica on this node once this reaches 100 percent, though existing volumes keep working undisturbed; once every node reaches 100 percent no new three-replica volume can be created anywhere in the cluster."
        - alert: LonghornSchedulingHeadroomCritical
          expr: longhorn:node_replica_scheduling:budget_used_percent > 97
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} is almost out of replica scheduling headroom"
            description: "Longhorn has promised {{ $value | printf \"%.0f\" }} percent of the schedulable budget on node {{ $labels.node }}, where the budget is disk capacity minus the per-disk reservation Longhorn withholds from scheduling, multiplied by the 200 percent over-provisioning factor Longhorn applies to declared replica sizes. New three-replica volume creation is about to fail cluster-wide. Free space by deleting unused volumes or their orphaned replicas, reduce an over-declared volume, or expand the disk."
        - alert: LonghornDiskUnschedulable
          expr: max by (node, disk) (longhorn_disk_status{condition="schedulable"}) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn has marked disk {{ $labels.disk }} on node {{ $labels.node }} unschedulable"
            description: "Longhorn itself reports that it will place no further replica on disk {{ $labels.disk }} on node {{ $labels.node }}, whether because the declared budget is exhausted or because real free space fell below the minimum-available floor. This reads Longhorn's own verdict rather than re-deriving its arithmetic, so it holds whatever the over-provisioning and reservation settings are, and it stays correct when the scheduling-headroom expressions no longer do."
    - name: volume.rules
      rules:
        - alert: PersistentVolumeFillingUp
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100) > 85
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PersistentVolumeClaim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.0f\" }} percent full"
            description: "The volume claimed by {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been over 85 percent full for an hour. This measures bytes actually written inside the filesystem, which no other rule here covers: the Longhorn scheduling headroom alerts count space promised to replicas rather than space consumed, so a volume can fill completely while they stay quiet."
        - alert: PersistentVolumeAlmostFull
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100) > 95
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "PersistentVolumeClaim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost out of space"
            description: "The volume claimed by {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.0f\" }} percent full. Writes are about to fail with ENOSPC, and a workload that cannot write often degrades something further downstream rather than failing visibly itself."
    - name: node.rules
      rules:
        - alert: NodeCpuTemperatureHigh
          expr: max by (instance) (node_hwmon_temp_celsius{instance!="pi-router"}) > 75
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} is running hot"
            description: "The hottest sensor on {{ $labels.instance }} has read {{ $value | printf \"%.0f\" }} degrees Celsius for over 15 minutes, well above the 45 to 60 degree band these nodes sit in at rest. The usual causes are a blocked intake, a failing fan or a sustained workload."
        - alert: NodeCpuTemperatureCritical
          expr: max by (instance) (node_hwmon_temp_celsius{instance!="pi-router"}) > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} is close to thermal throttling"
            description: "The hottest sensor on {{ $labels.instance }} has read {{ $value | printf \"%.0f\" }} degrees Celsius for over 5 minutes. Sustained temperatures at this level throttle the CPU and shorten hardware life."
    - name: etcd.rules
      rules:
        - alert: EtcdSnapshotTooOld
          expr: time() - (max(kube_etcdsnapshotfile_created{ready="true", location=~".*/etcd-snapshot-.*"}) or vector(0)) > 26 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "k3s has recorded no recent scheduled etcd snapshot"
            description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
        - alert: EtcdWalFsyncSlow
          expr: histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "etcd WAL fsync p99 is above 100ms"
            description: "The p99 etcd WAL fsync duration has exceeded 100 milliseconds for 15 minutes, against a 10 millisecond target for healthy etcd. etcd shares one NVMe with the Longhorn replica data on control-plane-1, so sustained slow fsync usually means storage contention rather than an etcd fault. The upstream etcdHighFsyncDurations alert only fires at 500 milliseconds, which is far above the range this estate operates in and would miss this entirely."
    - name: container.rules
      rules:
        - alert: ContainerMemoryNearLimit
          expr: max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is close to its memory limit"
            description: "Container {{ $labels.container }} has held above 85 percent of its memory limit for 30 minutes, currently {{ $value | humanizePercentage }}. Exceeding the limit is an immediate OOMKill rather than a gradual slowdown, so this is the only warning available before the container is terminated. Either the limit was set below what the workload needs or the workload is leaking."
        - alert: ContainerMemoryAtLimit
          expr: max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.95
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is about to be OOMKilled"
            description: "Container {{ $labels.container }} has held above 95 percent of its memory limit for 10 minutes, currently {{ $value | humanizePercentage }}. Raise the limit or restart the workload before the kernel does it."
        - alert: ContainerOOMKilled
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
            description: "Container {{ $labels.container }} restarted in the last hour and its previous instance was terminated for exceeding its memory limit. The limit is wrong or the workload is leaking; the container will keep being killed until one of the two is corrected."
    - name: image.rules
      rules:
        - alert: ContainerImagePullBackOff
          expr: max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff"}) == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been stuck in {{ $labels.reason }} for over 10 minutes, which covers both a wrong image reference and a registry rejecting pulls under rate limiting. The upstream KubeContainerWaiting alert treats every waiting reason alike and only fires after an hour, which missed the incident this alert is built to catch."
    - name: network.rules
      rules:
        - alert: FlannelInterfaceOrphaned
          expr: changes(node_network_iface_id{device="tailscale0", job="node-exporter"}[15m]) > 0 and on (instance) changes(node_boot_time_seconds{job="node-exporter"}[15m]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} tailscale0 interface was recreated without a reboot"
            description: "The tailscale0 interface index on {{ $labels.instance }} changed in the last 15 minutes while the node's boot time did not, which happens when tailscaled restarts and rebuilds the tunnel but k3s does not restart alongside it. flannel.1 stays bound to the old interface and nothing recreates it automatically, so the node stays Ready while its pods can reach nothing over the overlay. A full reboot also changes this interface's index, but it changes the node's boot time too and k3s restarts in step with tailscaled, so that case is excluded. Check the node's flannel.alpha.coreos.com/public-ip annotation and delete flannel.1 to force a rebind, per the disaster-recovery runbook."
        - alert: NodePodCidrOutsideAllowlist
          expr: kube_node_info{pod_cidr!~"10\\.42\\.[0-7]\\.0/24"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} holds podCIDR {{ $labels.pod_cidr }}, which no NetworkPolicy allows"
            description: "The NetworkPolicies that admit host-originated traffic into longhorn-system, cattle-system and postgres enumerate each node's flannel gateway pair as 10.42.N.0/32 and 10.42.N.1/32 for N from 0 to 7, because host traffic reaches a pod from cni0 or flannel.1 and never from the node's LAN address. Node {{ $labels.node }} now holds a podCIDR outside that range, so its kubelet and, on a control plane, its API server cannot reach pods in those namespaces. That presents as admission webhooks failing closed rather than as a network error. Widen the allowlists in the three networkpolicies files before the next reconcile depends on this node."
    - name: kube-state-metrics.rules
      rules:
        - alert: KubeStateMetricsAbsent
          expr: absent(kube_pod_info)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "kube-state-metrics has stopped reporting"
            description: "Prometheus has held no kube_pod_info series for more than 15 minutes, so every workload, node and capacity alert derived from kube-state-metrics is unable to fire."
