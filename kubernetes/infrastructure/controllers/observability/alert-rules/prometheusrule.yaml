apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gap-filler-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerCertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days"
            description: "The cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}."
        - alert: CertManagerCertExpired
          expr: certmanager_certificate_expiration_timestamp_seconds - time() <= 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has expired"
            description: "The cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} expired {{ $value | humanizeDuration }} ago."
    - name: flux.rules
      rules:
        - alert: FluxReconciliationFailure
          expr: max(flux_resource_info{ready="False", suspended="False"}) by (kind, name, exported_namespace) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} failed to reconcile"
            description: "The Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been ready for more than 15 minutes."
        - alert: FluxMetricsAbsent
          expr: absent(flux_resource_info)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux resource metrics have disappeared"
            description: "Prometheus has held no flux_resource_info series for more than 15 minutes, so FluxReconciliationFailure cannot fire and a stalled delivery pipeline would stay invisible."
    - name: cnpg.rules
      rules:
        - alert: CNPGBackupTooOld
          expr: time() - max by (namespace) (cnpg_collector_last_available_backup_timestamp{namespace="postgres"}) > 30 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CloudNativePG in {{ $labels.namespace }} has no recent backup"
            description: "The newest available CloudNativePG backup in namespace {{ $labels.namespace }} is {{ $value | humanizeDuration }} old, exceeding the 30 hour warning threshold for the daily backup schedule."
        - alert: CNPGBackupTooOldCritical
          expr: time() - max by (namespace) (cnpg_collector_last_available_backup_timestamp{namespace="postgres"}) > 50 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG in {{ $labels.namespace }} has a dangerously stale backup"
            description: "The newest available CloudNativePG backup in namespace {{ $labels.namespace }} is {{ $value | humanizeDuration }} old, exceeding the 50 hour critical threshold and indicating several missed daily backups."
        - alert: CNPGBackupStuck
          expr: kube_cnpg_backup_phase_info{phase!~"completed|failed"} == 1
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG backup {{ $labels.namespace }}/{{ $labels.name }} is stuck in phase {{ $labels.phase }}"
            description: "The CloudNativePG backup {{ $labels.namespace }}/{{ $labels.name }} has been in the non-terminal phase {{ $labels.phase }} for more than 6 hours. CloudNativePG never times such a backup out and a ScheduledBackup refuses to create a new one while a non-terminal backup exists, so every later run is suppressed until this object reaches a terminal phase or is deleted."
        - alert: CNPGWALArchiveFailing
          expr: sum by (namespace) (increase(cnpg_pg_stat_archiver_failed_count{namespace="postgres"}[15m])) > 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG WAL archiving is failing in {{ $labels.namespace }}"
            description: "CloudNativePG in namespace {{ $labels.namespace }} recorded {{ $value | printf \"%.0f\" }} failed WAL archive attempts in the last 15 minutes. The archiver retries one stuck segment on a fixed loop, so a sustained rate means continuous archiving has stopped and point-in-time recovery is frozen at the last archived segment. The counters live only on whichever instance is primary and reset when the role moves, so this sums across the namespace rather than tracking a pod."
        - alert: CNPGWALArchiveBacklog
          expr: max by (namespace) (cnpg_collector_pg_wal_archive_status{namespace="postgres", value="ready"}) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG has unarchived WAL segments in {{ $labels.namespace }}"
            description: "CloudNativePG in namespace {{ $labels.namespace }} has {{ $value | printf \"%.0f\" }} WAL segments waiting to be archived and has not cleared them for 30 minutes. WAL shares the data volume, so a backlog that keeps growing eventually fills it and stops the primary. This measures the backlog directly and carries no counter-reset semantics, so it stays valid across a switchover."
    - name: longhorn.rules
      rules:
        - alert: LonghornBackupTooOld
          expr: time() - max by (volume) (longhorn_volume_last_backup_at > 0) > 30 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} has no recent backup"
            description: "The newest Longhorn backup for volume {{ $labels.volume }} is {{ $value | humanizeDuration }} old, exceeding the 30 hour warning threshold for the nightly recurring job."
        - alert: LonghornBackupTooOldCritical
          expr: time() - max by (volume) (longhorn_volume_last_backup_at > 0) > 50 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} has a dangerously stale backup"
            description: "The newest Longhorn backup for volume {{ $labels.volume }} is {{ $value | humanizeDuration }} old, exceeding the 50 hour critical threshold and indicating several missed nightly runs."
        - alert: LonghornVolumeNeverBackedUp
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at) == 0
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has never been backed up"
            description: "Longhorn has recorded no backup at all for volume {{ $labels.volume }}, claimed by {{ $labels.pvc_namespace }}/{{ $labels.pvc }}, for over 26 hours. The stale-backup alerts cannot see this case because they compare against the newest backup timestamp, which does not exist here. A volume in this state has no restore point whatsoever."
        - alert: LonghornBackupFailed
          expr: max by (backup, volume) (longhorn_backup_state) == 4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup {{ $labels.backup }} is in Error state"
            description: "Longhorn reports backup {{ $labels.backup }} of volume {{ $labels.volume }} in Error state. A failed backup leaves the volume on its previous restore point, or on none at all if this was its first, and the recurring job does not retry until the next scheduled run."
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Longhorn reports volume {{ $labels.volume }} as degraded for over 30 minutes, so it is running with fewer healthy replicas than configured."
    - name: etcd.rules
      rules:
        - alert: EtcdSnapshotTooOld
          expr: time() - (max(kube_etcdsnapshotfile_created{ready="true", location=~".*/etcd-snapshot-.*"}) or vector(0)) > 26 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "k3s has recorded no recent scheduled etcd snapshot"
            description: "No usable k3s etcd snapshot from the schedule has been recorded in the last 26 hours, which is two missed runs of the twelve hourly snapshot schedule, so the restore point for the whole cluster is frozen at the last successful run. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot taken by hand would otherwise hide a schedule that has stopped running."
        - alert: EtcdSnapshotNotUploaded
          expr: time() - (max(kube_etcdsnapshotfile_created{ready="true", location=~"s3://.*/etcd-snapshot-.*"}) or vector(0)) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No scheduled k3s etcd snapshot has reached object storage"
            description: "No usable k3s etcd snapshot from the schedule with an s3:// location has been recorded in the last 26 hours. Snapshots written only to the server node disappear with that node, so the cluster has no offsite restore point even when local snapshots are still being taken. Only snapshots the schedule named etcd-snapshot-* are counted, because an on-demand snapshot uploaded by hand would otherwise hide a schedule that has stopped running."
    - name: kube-state-metrics.rules
      rules:
        - alert: KubeStateMetricsAbsent
          expr: absent(kube_pod_info)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "kube-state-metrics has stopped reporting"
            description: "Prometheus has held no kube_pod_info series for more than 15 minutes, so every workload, node and capacity alert derived from kube-state-metrics is unable to fire."
    - name: velero.rules
      rules:
        - alert: VeleroBackupTooOld
          expr: time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule!=""}) > 30 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} has no recent successful backup"
            description: "The newest successful Velero backup for schedule {{ $labels.schedule }} is {{ $value | humanizeDuration }} old, exceeding the 30 hour warning threshold for the daily backup schedule."
        - alert: VeleroBackupTooOldCritical
          expr: time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule!=""}) > 50 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} has a dangerously stale backup"
            description: "The newest successful Velero backup for schedule {{ $labels.schedule }} is {{ $value | humanizeDuration }} old, exceeding the 50 hour critical threshold and indicating several missed daily backups."
        - alert: VeleroBackupFailing
          expr: increase(velero_backup_failure_total{schedule!=""}[2h]) + increase(velero_backup_validation_failure_total{schedule!=""}[2h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} is failing"
            description: "Velero schedule {{ $labels.schedule }} recorded backup or validation failures in the last two hours, so the offsite copy is not being written."
