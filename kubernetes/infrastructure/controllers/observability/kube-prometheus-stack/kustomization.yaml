apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

components:
  - ../../../../components/forward-auth

resources:
  - helmrelease.yaml
  - grafana-rbac.yaml
  - grafana-ingress.yaml
  - prometheus-ingress.yaml
  - alertmanager-ingress.yaml
  - slo-dashboard.yaml
  - wallbar-dashboard.yaml

configMapGenerator:
  - name: prometheus-values
    files:
      - values.yaml=configmap-values.yaml
  - name: grafana-dashboard-cert-manager
    files:
      - dashboards/cert-manager.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-loki-logs
    files:
      - dashboards/loki-logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-node-exporter-full
    files:
      - dashboards/node-exporter-full.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik
    files:
      - dashboards/traefik.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

configurations:
  - kustomizeconfig.yaml

