# Reduce resource usage for homelab
prometheus:
  prometheusSpec:
    priorityClassName: system-cluster-critical
    retention: 7d
    retentionSize: 17GiB
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job.longhorn.io/snapshot-prune: enabled
            recurring-job.longhorn.io/filesystem-trim: enabled
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: "200m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "3Gi"
    additionalScrapeConfigs:
      - job_name: pi-router
        scrape_interval: 30s
        static_configs:
          - targets:
              - "10.20.0.1:9100"
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: pi-router

kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: true
  endpoints:
    - 10.20.0.10

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 384Mi
  rbac:
    extraRules:
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["backups"]
        verbs: ["list", "watch"]
      - apiGroups: ["k3s.cattle.io"]
        resources: ["etcdsnapshotfiles"]
        verbs: ["list", "watch"]
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        resources: ["helmreleases"]
        verbs: ["list", "watch"]
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: kube_cnpg_backup
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: phase_info
                help: "Phase reported by a CloudNativePG backup"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]
          - groupVersionKind:
              group: k3s.cattle.io
              version: v1
              kind: ETCDSnapshotFile
            metricNamePrefix: kube_etcdsnapshotfile
            labelsFromPath:
              name: [metadata, name]
              node: [spec, nodeName]
              location: [spec, location]
              ready: [status, readyToUse]
            metrics:
              - name: created
                help: "Creation time of a k3s etcd snapshot"
                each:
                  type: Gauge
                  gauge:
                    path: [status, creationTime]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: kube_helmrelease
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: status_condition
                help: "Status condition reported by a Flux HelmRelease"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: ["type"]
                    valueFrom: ["status"]
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            metricNamePrefix: kube_longhornvolume
            labelsFromPath:
              name: [metadata, name]
              pvc: [status, kubernetesStatus, pvcName]
              pvc_namespace: [status, kubernetesStatus, namespace]
            metrics:
              - name: status_condition
                help: "Status condition reported by a Longhorn volume"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: ["type"]
                    valueFrom: ["status"]
              - name: declared_bytes
                help: "Size a Longhorn volume declares, which is what its replicas cost to schedule"
                each:
                  type: Gauge
                  gauge:
                    path: [spec, size]
              - name: actual_bytes
                help: "Size a Longhorn volume actually occupies"
                each:
                  type: Gauge
                  gauge:
                    path: [status, actualSize]
              - name: replicas
                help: "Replica count a Longhorn volume is configured for"
                each:
                  type: Gauge
                  gauge:
                    path: [spec, numberOfReplicas]

defaultRules:
  rules:
    kubeApiserverBurnrate: false
    kubeApiserverSlos: false

grafana:
  enabled: true
  grafana.ini:
    auth.anonymous:
      enabled: false
    security:
      allow_embedding: true
  image:
    tag: "13.2.1"
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: longhorn
    extraPvcLabels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/snapshot: enabled
      recurring-job.longhorn.io/snapshot-prune: enabled
      recurring-job.longhorn.io/filesystem-trim: enabled

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: traceID
            datasourceUid: tempo
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          filterByTraceID: true
          filterBySpanID: false
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource: Loki
      traefik:
        gnetId: 17346
        revision: 9
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus

  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: ntfy
          receivers:
            - uid: ntfy_webhook
              type: webhook
              settings:
                url: "http://ntfy.ntfy.svc.cluster.local/alerts?tpl=yes&title=%7B%7B.title%7D%7D&message=%7B%7B.message%7D%7D"
                httpMethod: POST
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: ntfy
          group_by: ['grafana_folder', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: logs
          folder: Homelab
          interval: 1m
          rules:
            - uid: loki-error-spike
              title: HighLogErrorRate
              condition: C
              for: 5m
              noDataState: OK
              execErrState: Error
              labels:
                severity: warning
              annotations:
                summary: 'High error log rate in {{ "{{ $labels.namespace }}" }}'
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: loki
                  model:
                    refId: A
                    datasource:
                      type: loki
                      uid: loki
                    expr: 'sum by (namespace) (count_over_time({namespace=~".+"} |~ `(?i:level=error|"level":"error")|\bERROR\b` [5m]))'
                    queryType: instant
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    conditions:
                      - evaluator:
                          type: gt
                          params: [50]

alertmanager:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  alertmanagerSpec:
    replicas: 2
    podAntiAffinity: hard
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'ntfy'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: 'ntfy-critical'
          matchers:
            - severity = critical
          repeat_interval: 1h
        - receiver: 'deadman'
          matchers:
            - alertname = "Watchdog"
          repeat_interval: 5m
        - receiver: 'null'
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      - name: 'null'
      - name: 'ntfy'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alerts?tpl=yes&title=%7B%7B.status%20%7C%20upper%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D%20%28%7B%7Blen%20.alerts%7D%7D%29&message=%7B%7B.commonLabels.severity%7D%7D%20%7C%20%7B%7Bwith%20.commonAnnotations.summary%7D%7D%7B%7B.%7D%7D%7B%7Bend%7D%7D'
            send_resolved: true
      - name: 'ntfy-critical'
        webhook_configs:
          - url: 'http://ntfy.ntfy.svc.cluster.local/alerts?tpl=yes&title=%7B%7B.status%20%7C%20upper%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D%20%28%7B%7Blen%20.alerts%7D%7D%29&message=%7B%7B.commonLabels.severity%7D%7D%20%7C%20%7B%7Bwith%20.commonAnnotations.summary%7D%7D%7B%7B.%7D%7D%7B%7Bend%7D%7D&priority=urgent'
            send_resolved: true
      - name: 'deadman'
        webhook_configs:
          - url: 'http://10.20.0.1:9095/'
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
