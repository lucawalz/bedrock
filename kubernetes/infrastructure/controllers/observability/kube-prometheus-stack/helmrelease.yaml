apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.18.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values
      optional: false
  install:
    timeout: 20m
    strategy:
      name: RetryOnFailure
  upgrade:
    timeout: 20m
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn

