apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: false
  driftDetection:
    mode: warn
  values:
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
