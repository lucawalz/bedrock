apiVersion: v1
kind: Service
metadata:
  name: flux-operator
spec:
  type: ExternalName
  externalName: flux-operator.flux-system.svc.cluster.local
  ports:
    - name: http
      port: 9080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-operator
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Flux
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: flux.png
    gethomepage.dev/href: https://flux.syslabs.dev
    # The pods live outside this namespace, which homepage's pod-selector cannot reach.
    gethomepage.dev/siteMonitor: https://flux.syslabs.dev
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flux.syslabs.dev`)
      kind: Rule
      middlewares:
        - name: forward-auth
      services:
        - name: flux-operator
          port: 9080
  tls: {}
