apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: "42.3.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    priorityClassName: system-cluster-critical
    deployment:
      replicas: 2
      terminationGracePeriodSeconds: 60
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - sleep 15
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: '{{ template "traefik.name" . }}'
                app.kubernetes.io/instance: '{{ .Release.Name }}-{{ .Release.Namespace }}'
            topologyKey: kubernetes.io/hostname
    service:
      spec:
        type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 10.20.0.50
    ports:
      web:
        nodePort: 30080
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        nodePort: 30443
    additionalArguments:
      - --entryPoints.websecure.http.middlewares=traefik-security-headers@kubernetescrd
    readinessProbe:
      failureThreshold: 3
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: alloy.monitoring.svc.cluster.local:4317
          insecure: true
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    rbac:
      namespaced: true
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        namespaces:
          - blog
          - homepage
          - litellm
          - llm
          - monitoring
          - ntfy
          - oauth2-proxy
          - paperless
          - pocket-id
          - traefik
          - zot
      kubernetesIngress:
        namespaces:
          - blog
          - homepage
          - litellm
          - llm
          - monitoring
          - ntfy
          - oauth2-proxy
          - paperless
          - pocket-id
          - traefik
          - zot
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-syslabs-dev-tls
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 60s
          honorLabels: true
          additionalLabels:
            release: kube-prometheus-stack
    image:
      registry: docker.io
      repository: traefik
      tag: v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
  install:
    crds: Skip
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: Skip
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: warn
