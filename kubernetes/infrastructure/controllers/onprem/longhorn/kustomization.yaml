apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../../../components/authentik-middleware
- ../../../../components/network-policies/internet-egress
resources:
- backup-target.yaml
- helmrelease.yaml
- ingress.yaml
- networkpolicies.yaml
- pdb.yaml
- recurringjobs.yaml
- storageclass-cache.yaml
- storageclass-disposable.yaml
- storageclass-retain.yaml
patches:
# the longhorn HelmRelease lives in flux-system, so this kustomization cannot carry a namespace transformer
- patch: |-
    - op: add
      path: /metadata/namespace
      value: longhorn-system
  target:
    kind: Middleware
    name: authentik-forward-auth
- patch: |-
    - op: add
      path: /metadata/namespace
      value: longhorn-system
  target:
    kind: NetworkPolicy
    name: allow-internet-egress
- patch: |-
    - op: add
      path: /spec/values/csiPlugin
      value:
        attacher:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        provisioner:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        resizer:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        snapshotter:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
  target:
    kind: HelmRelease
    name: longhorn
