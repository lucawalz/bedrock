---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      version: 1.12.1
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: false
  interval: 30m0s
  storageNamespace: longhorn-system
  targetNamespace: longhorn-system
  values:
    longhornManager:
      nodeSelector:
        bedrock.io/storage: "true"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    longhornDriver:
      nodeSelector:
        bedrock.io/storage: "true"
    longhornUI:
      replicas: 1
      nodeSelector:
        bedrock.io/storage: "true"
    defaultSettings:
      allowVolumeCreationWithDegradedAvailability: false
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 3
      freezeFilesystemForSnapshot: true
      replicaSoftAntiAffinity: false
      storageMinimalAvailablePercentage: 25
      storageOverProvisioningPercentage: 100
      storageReservedPercentageForDefaultDisk: 30
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      systemManagedComponentsNodeSelector: "bedrock.io/storage:true"
      systemManagedCSIComponentsResourceLimits: >-
        {"csi-attacher":{"requests":{"cpu":"25m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-provisioner":{"requests":{"cpu":"25m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-resizer":{"requests":{"cpu":"25m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-snapshotter":{"requests":{"cpu":"25m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"64Mi"},"limits":{"memory":"256Mi"}},
        "node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}},
        "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}
      orphanResourceAutoDeletion: "replica-data;instance"
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
