apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: zot
      version: "0.1.122"
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/project-zot/zot
      tag: v2.1.20
    service:
      type: ClusterIP
      port: 5000
    persistence: true
    pvc:
      create: true
      name: data
      accessModes:
        - ReadWriteOnce
      storage: 50Gi
      storageClassName: longhorn-disposable
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30
    mountConfig: true
    configFiles:
      config.json: |-
        {
          "storage": {
            "rootDirectory": "/var/lib/registry"
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000"
          },
          "log": {
            "level": "info"
          },
          "extensions": {
            "sync": {
              "enable": true,
              "registries": [
                {
                  "urls": ["https://registry-1.docker.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "10s",
                  "content": [
                    {
                      "prefix": "**",
                      "destination": "/docker.io",
                      "stripPrefix": false
                    }
                  ]
                },
                {
                  "urls": ["https://ghcr.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "10s",
                  "content": [
                    {
                      "prefix": "**",
                      "destination": "/ghcr.io",
                      "stripPrefix": false
                    }
                  ]
                },
                {
                  "urls": ["https://quay.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "10s",
                  "content": [
                    {
                      "prefix": "**",
                      "destination": "/quay.io",
                      "stripPrefix": false
                    }
                  ]
                },
                {
                  "urls": ["https://registry.k8s.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "10s",
                  "content": [
                    {
                      "prefix": "**",
                      "destination": "/registry.k8s.io",
                      "stripPrefix": false
                    }
                  ]
                }
              ]
            }
          }
        }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
