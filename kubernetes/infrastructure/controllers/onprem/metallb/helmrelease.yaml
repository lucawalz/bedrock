apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.x"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  values:
    prometheus:
      rbacPrometheus: true
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: monitoring
      serviceMonitor:
        enabled: true
        speaker:
          additionalLabels:
            release: kube-prometheus-stack
        controller:
          additionalLabels:
            release: kube-prometheus-stack
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
