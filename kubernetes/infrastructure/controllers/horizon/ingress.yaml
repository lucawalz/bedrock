apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: horizon
  namespace: horizon-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: horizon
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: kubernetes.png
    gethomepage.dev/href: https://horizon.syslabs.dev
    gethomepage.dev/podSelector: app.kubernetes.io/component=interface
    gethomepage.dev/statusStyle: "dot"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`horizon.syslabs.dev`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
      services:
        - name: horizon-interface
          port: 8082
  tls: {}
