apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: horizon
  namespace: horizon-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: horizon
      version: "0.10.0"
      sourceRef:
        kind: HelmRepository
        name: lucawalz
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: false
  values:
    ui:
      enabled: true
      externalOrigin: https://horizon.syslabs.dev
      oidc:
        issuer: https://auth.syslabs.dev/application/o/horizon/
        audience: horizon-interface
      rbac:
        impersonateUsers:
          - lucawalz
      networkPolicy:
        enabled: false
