apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../../components/authentik-middleware
resources:
  - helmrelease.yaml
  - ingress.yaml
patches:
- patch: |-
    - op: add
      path: /metadata/namespace
      value: postgres
  target:
    kind: Middleware
    name: authentik-forward-auth
